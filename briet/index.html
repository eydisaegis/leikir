<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talnaland</title>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&amp;family=Grandstander:wght@600;800&amp;display=swap" rel="stylesheet">
<style>
:root {
  /* Talnaland: a picture book from the Icelandic coast. One light world, by choice. */
  --mist: #E4F0EF;    /* page: fjord mist */
  --wool: #FFFDF6;    /* cards: undyed wool */
  --lava: #1C2632;    /* text and outlines: basalt */
  --sea: #1B7A8A;     /* fjord teal */
  --beak: #F26A21;    /* puffin beak: the one loud color, kept for the main action */
  --moss: #4C8733;    /* moss: a right answer */
  --lupine: #5852C4;  /* lupine violet */
  --sun: #F7C331;     /* yolk: stars and hints */
  --berry: #C2385B;   /* redcurrant: the shop */
  --stone: #C3CDD3;   /* stepping stones and coins */
  --pulp: #BDAE90;    /* egg carton */
  --font-display: "Grandstander", ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Andika", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  /* layout: one phone-tall stage. The puffin's speech bubble on top, the toy in the middle, one big answer row at the bottom. */
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--mist); color: var(--lava);
  font-family: var(--font-body); line-height: 1.3;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation;
}
button {
  font: inherit; color: inherit; margin: 0; padding: 0; border: 0; background: none;
  cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
button:focus-visible, input:focus-visible { outline: .2em solid var(--lupine); outline-offset: .15em; }
h1, h2, p { margin: 0; }
svg { display: block; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.ico { width: 1.5em; height: 1.5em; flex: none; }

#app { height: 100%; overflow-x: hidden; overflow-y: auto; }
.stage {
  width: min(100%, 38em); min-height: 100%; margin: 0 auto;
  display: flex; flex-direction: column; gap: .75em;
  padding: .9em max(1em, 16px) 1em;
  font-size: clamp(15px, min(4.4vw, 2.45vh), 27px);
}
@supports (height: 1dvh) {
  .stage { font-size: clamp(15px, min(4.4vw, 2.45dvh), 27px); }
}

/* ---------- shared pieces ---------- */
.round {
  width: 2.9em; height: 2.9em; border-radius: 50%; flex: none;
  background: var(--wool); border: .14em solid var(--lava);
  display: grid; place-items: center; box-shadow: 0 .2em 0 var(--lava);
}
.round:active { transform: translateY(.14em); box-shadow: 0 .06em 0 var(--lava); }

.big {
  min-height: 2.5em; width: 100%; border-radius: .8em;
  border: .11em solid var(--lava); background: var(--beak); color: var(--lava);
  font-family: var(--font-display); font-weight: 800; font-size: 1.35em;
  box-shadow: 0 .19em 0 var(--lava);
  display: flex; align-items: center; justify-content: center; gap: .4em; padding: .15em 1em;
}
.big:active { transform: translateY(.14em); box-shadow: 0 .05em 0 var(--lava); }
.big.quiet { background: var(--wool); }
.big .ico { width: 1.15em; height: 1.15em; stroke-width: 3.4; }

.mini {
  align-self: center; display: inline-flex; align-items: center; gap: .4em;
  padding: .4em 1em; border-radius: 99em; border: .14em solid var(--lava);
  background: var(--wool); font-weight: 700; box-shadow: 0 .18em 0 var(--lava);
}
.mini:active { transform: translateY(.12em); box-shadow: 0 .06em 0 var(--lava); }
.mini .ico { width: 1.3em; height: 1.3em; }

.talk { display: grid; grid-template-columns: 4.8em 1fr; align-items: end; gap: .9em; }
.puffin { width: 100%; height: auto; overflow: visible; transform-origin: 50% 100%; }
.puffin .wing { transform-box: fill-box; transform-origin: 70% 8%; }
.puffin.cheer { animation: cheer .7s ease-out; }
.puffin.cheer .wing { animation: flap .7s ease-in-out; }
.puffin.tilt { animation: tilt .5s ease-in-out; }
.bubble {
  position: relative; min-height: 4.1em; padding: .6em .85em;
  display: flex; align-items: center;
  background: var(--wool); border: .13em solid var(--lava); border-radius: 1.1em;
  font-size: 1.1em; line-height: 1.25;
}
.bubble::before {
  content: ""; position: absolute; left: -.6em; bottom: 1.1em; width: 1em; height: 1em;
  background: inherit; border-left: inherit; border-bottom: inherit;
  transform: rotate(45deg); border-radius: 0 0 0 .2em;
}
.bubble b {
  font-family: var(--font-display); font-weight: 800; font-size: 1.4em; line-height: 1;
  white-space: nowrap;
}
.bubble.good { background: #E3F0D8; background: color-mix(in srgb, var(--moss) 16%, var(--wool)); border-color: var(--moss); }
.bubble.hint { background: #FDEFC4; background: color-mix(in srgb, var(--sun) 32%, var(--wool)); }
.yay { font-family: var(--font-display); font-weight: 800; color: var(--moss); }

.choices { display: grid; grid-template-columns: repeat(var(--k, 4), 1fr); gap: .6em; }
.choice {
  min-height: 2.1em; border-radius: .55em; border: .075em solid var(--lava);
  background: var(--wool); font-family: var(--font-display); font-weight: 800; font-size: 2em;
  box-shadow: 0 .13em 0 var(--lava);
}
.choice:active { transform: translateY(.09em); box-shadow: 0 .04em 0 var(--lava); }
.choice.out { opacity: .32; box-shadow: none; transform: translateY(.13em); }
.choice.hit { background: var(--moss); color: #fff; }
.choice.hint { background: var(--sun); animation: pulse 1s ease-in-out infinite; }

/* ---------- home ---------- */
.home-head { display: flex; align-items: center; gap: .6em; }
.brand {
  flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 800;
  font-size: 2.3em; line-height: 1; letter-spacing: -.015em;
}
.brand span { color: var(--beak); }
.pill {
  display: inline-flex; align-items: center; gap: .3em; padding: .22em .7em .22em .45em;
  background: var(--wool); border: .12em solid var(--lava); border-radius: 99em;
  font-family: var(--font-display); font-weight: 800; font-size: 1.2em;
}
.pill svg { width: 1.25em; height: 1.25em; }
.lopi {
  height: 1.8em; margin-inline: calc(-1 * max(1em, 16px));
  border-block: .14em solid var(--lava);
  background: var(--wool) var(--lopi-art) repeat-x center / auto 100%;
}
.tiles { flex: 1; max-height: 33em; display: grid; grid-template-columns: 1fr 1fr; gap: .8em; padding-bottom: .3em; }
.tile {
  display: grid; grid-template-rows: 1fr auto auto; justify-items: start; gap: .3em;
  min-height: 8.2em; padding: .75em .85em .75em; text-align: left;
  background: var(--tone); color: var(--ink, #fff);
  border: .14em solid var(--lava); border-radius: 1.2em; box-shadow: 0 .28em 0 var(--lava);
}
.tile:active { transform: translateY(.2em); box-shadow: 0 .08em 0 var(--lava); }
.tile-art { align-self: center; height: 3.5em; }
.tile-art svg { height: 100%; width: auto; overflow: visible; }
.tile-name { font-family: var(--font-display); font-weight: 800; font-size: 1.22em; line-height: 1.05; }
.pips { display: flex; align-items: center; gap: .3em; font-size: .82em; font-weight: 700; }
.pips i { width: .8em; height: .8em; border-radius: 50%; border: .15em solid currentColor; }
.pips i.on { background: currentColor; }
.pips span { margin-right: .25em; }
.tile:nth-child(5) {
  grid-column: 1 / -1; min-height: 5.6em;
  grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 1em; align-content: center;
}
.tile:nth-child(5) .tile-art { grid-row: 1 / 3; }
.tile:nth-child(5) .tile-name { align-self: end; }
.tile:nth-child(5) .pips { align-self: start; }

/* ---------- game frame ---------- */
.bar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .7em; }
.steps { display: flex; justify-content: center; gap: .5em; }
.steps i { width: 1em; height: 1em; border-radius: 50%; border: .14em solid var(--lava); background: var(--wool); }
.steps i.done { background: var(--moss); }
.steps i.now { background: var(--sun); transform: scale(1.3); }
.steps i.pop { animation: pop .35s ease-out; }
.play { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: .75em; min-height: 0; }
.acts { display: grid; gap: .6em; padding-bottom: .25em; }

/* ---------- 1: Svangi lundinn ---------- */
.plate {
  display: grid; gap: .3em; padding: .5em;
  background: var(--wool); border: .14em solid var(--lava); border-radius: 1em;
}
.prow { display: flex; gap: .3em; }
.prow .gap { flex: 0 0 .45em; }
.slot {
  flex: 1 1 0; min-width: 0; aspect-ratio: 5 / 3; position: relative;
  display: grid; place-items: center; border-radius: .45em;
  border: .1em dashed rgba(28, 38, 50, .2);
}
.plate.ten .slot { aspect-ratio: 1; }
.slot.full { border-color: transparent; }
.slot.want { border: .12em solid var(--beak); background: #FDEFC4; background: color-mix(in srgb, var(--sun) 32%, var(--wool)); }
.slot.extra .fish-art { opacity: .4; }
.slot .fish-art { width: 94%; }
.slot .n {
  position: absolute; right: -.1em; bottom: -.15em; min-width: 1.35em; padding: 0 .2em;
  background: var(--sun); border: .1em solid var(--lava); border-radius: 99em;
  font-family: var(--font-display); font-weight: 800; font-size: .72em; line-height: 1.3; text-align: center;
}
.plate.ten .slot .n { font-size: .6em; }
.slot.pop .fish-art { animation: pop .28s ease-out; }
.sea {
  display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: .2em; padding: .5em;
  background-color: var(--sea);
  background-image: radial-gradient(circle at 50% -60%, transparent 62%, rgba(255, 255, 255, .16) 63% 69%, transparent 70%);
  background-size: 3.2em 1.5em;
  border: .14em solid var(--lava); border-radius: 1em;
}
.fish { min-height: 2.6em; display: grid; place-items: center; }
.fish .fish-art { width: min(94%, 4.4em); transform: rotate(var(--tilt, 0deg)); }
.fish.flip .fish-art { transform: scaleX(-1) rotate(var(--tilt, 0deg)); }
.fish.gone { visibility: hidden; }
.fish:active .fish-art { opacity: .7; }

/* ---------- 2: Hvað eru margir? ---------- */
.flash {
  align-self: center; position: relative; width: min(100%, 15em); aspect-ratio: 1; overflow: hidden;
  background: var(--wool); border: .14em solid var(--lava); border-radius: 1.4em; box-shadow: 0 .28em 0 var(--lava);
}
.flash.wide { width: 100%; max-width: 26em; aspect-ratio: 400 / 180; }
.flash svg { width: 100%; height: 100%; }
.flash .lid {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: var(--lupine); color: #fff;
  font-family: var(--font-display); font-weight: 800; font-size: 5em; transition: opacity .16s;
}
.flash.open .lid { opacity: 0; }

/* ---------- 3: Tíuvinir ---------- */
.carton {
  align-self: center; position: relative; width: min(100%, 21em);
  display: grid; grid-template-columns: repeat(5, 1fr); gap: .4em; padding: .55em;
  background: var(--pulp); border: .14em solid var(--lava); border-radius: 1.1em; box-shadow: 0 .28em 0 var(--lava);
}
.cup {
  aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  background: #8F8166; background: color-mix(in srgb, var(--lava) 28%, var(--pulp));
  box-shadow: inset 0 .22em 0 rgba(28, 38, 50, .22);
}
.cup.want { outline: .16em dashed var(--wool); outline-offset: -.1em; animation: pulse 1s ease-in-out infinite; }
.egg {
  width: 62%; height: 80%; background: var(--wool); border: .13em solid var(--lava);
  border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
}
.egg.gold { background: var(--sun); animation: pop .35s ease-out both; }
.carton .lid {
  position: absolute; inset: -.14em; display: grid; place-items: center;
  background: var(--pulp); border: .14em solid var(--lava); border-radius: 1.1em;
  background-image: repeating-linear-gradient(90deg, transparent 0 2.2em, rgba(28, 38, 50, .12) 2.2em 2.34em);
  font-family: var(--font-display); font-weight: 800; font-size: 1em;
}
.carton .lid span {
  font-size: 2.6em; line-height: 1; padding: .12em .5em; background: var(--wool);
  border: .06em solid var(--lava); border-radius: .3em;
}
.sum {
  font-family: var(--font-display); font-weight: 800; font-size: 2.7em; line-height: 1.1;
  text-align: center;
}
.sum .q {
  display: inline-block; min-width: 1.15em; padding: 0 .12em; color: var(--beak);
  border-bottom: .09em solid var(--beak);
}
.sum .q.got { color: var(--moss); border-color: var(--moss); animation: pop .35s ease-out; }

/* ---------- 4: Kindahopp ---------- */
.field {
  display: grid; overflow: hidden; padding-top: .7em;
  background: #BBD6A6; background: color-mix(in srgb, var(--moss) 36%, var(--wool));
  border: .14em solid var(--lava); border-radius: 1.2em;
}
.sign {
  justify-self: center; display: flex; align-items: center; gap: .25em; margin-bottom: .3em;
  padding: .12em .5em .02em; background: var(--wool); border: .06em solid var(--lava); border-radius: .28em;
  box-shadow: 0 .08em 0 var(--lava);
  font-family: var(--font-display); font-weight: 800; font-size: 2.4em; line-height: 1.1;
}
.sign .ico { width: .8em; height: .8em; stroke-width: 3.2; margin-bottom: .1em; }
.stream {
  padding: 0 .35em .7em; background-color: var(--sea); border-top: .14em solid var(--lava);
  background-image: radial-gradient(circle at 50% -60%, transparent 62%, rgba(255, 255, 255, .16) 63% 69%, transparent 70%);
  background-size: 3.2em 1.5em;
}
.stones {
  --rowh: 3.1em; --rowgap: 1em; --head: 3em; --sw: 3.3em;
  position: relative; display: grid; padding-top: var(--head);
  grid-template-columns: repeat(calc(var(--n) + 1), 1fr);
  grid-template-rows: var(--rowh) var(--rowh); row-gap: var(--rowgap);
}
.stone {
  grid-row: 1; justify-self: center; position: relative; width: min(100%, 3.5em);
  background: var(--stone); border: .11em solid var(--lava);
  border-radius: 48% 52% 46% 54% / 56% 58% 42% 44%; box-shadow: 0 .15em 0 var(--lava);
  font-family: var(--font-display); font-weight: 800; font-size: 1.15em;
}
.stone.low { grid-row: 2; }
.stone.two { letter-spacing: -.04em; }
.stone.start { background: var(--wool); }
.stone.hit { background: var(--sun); }
.stone.hint { background: var(--sun); animation: pulse 1s ease-in-out infinite; }
.stone.shake { animation: shake .4s; }
.stone .mark {
  position: absolute; top: -.55em; right: -.2em; width: 1.5em; height: 1.5em; display: grid; place-items: center;
  background: var(--beak); border: .12em solid var(--lava); border-radius: 50%;
  font-style: normal; font-size: .62em; line-height: 1; letter-spacing: 0; animation: pop .3s ease-out;
}
.sheep {
  position: absolute; z-index: 3; pointer-events: none; width: var(--sw); margin-left: calc(var(--sw) / -2);
  left: calc((var(--i) + 1) * 100% / (var(--n) + 1));
  top: calc(var(--head) + .62em - var(--sw) * .778);
  transition: left .34s linear, top .34s linear;
}
.sheep.low { top: calc(var(--head) + var(--rowh) + var(--rowgap) + .62em - var(--sw) * .778); }
.sheep.back svg { transform: scaleX(-1); }
.sheep-in.hop { animation: hop .34s ease-out; }

/* ---------- 5: Búðin ---------- */
.shelf { display: flex; justify-content: center; align-items: stretch; gap: .6em; }
.ware {
  display: grid; justify-items: center; gap: .2em; min-width: 5.8em; padding: .45em .7em .55em;
  background: var(--wool); border: .14em solid var(--lava); border-radius: 1em; box-shadow: 0 .22em 0 var(--lava);
}
.ware svg { width: 3.4em; height: 3.4em; overflow: visible; }
.tag {
  padding: .06em .5em 0; background: var(--sun); border: .09em solid var(--lava); border-radius: .4em;
  font-family: var(--font-display); font-weight: 800; font-size: 1.3em; line-height: 1.2; white-space: nowrap;
}
.plus { align-self: center; font-family: var(--font-display); font-weight: 800; font-size: 2.2em; }
.till {
  display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; align-items: center; gap: .4em;
  min-height: 6.6em; padding: .5em; width: 100%;
  background: #F6E3DD; background: color-mix(in srgb, var(--berry) 14%, var(--wool));
  border: .14em solid var(--lava); border-radius: 1em;
}
.till.fives { max-width: 16em; align-self: center; }
.till.shake { animation: shake .4s; }
.till-empty { align-self: center; margin: auto; opacity: .45; font-weight: 700; }
.coin {
  width: var(--d, 2.5em); height: var(--d, 2.5em); flex: none; border-radius: 50%;
  display: grid; place-content: center; justify-items: center;
  background: radial-gradient(circle at 34% 28%, #fff 0, var(--stone) 72%);
  border: .12em solid var(--lava); box-shadow: 0 .13em 0 var(--lava);
  font-family: var(--font-display); font-weight: 800; line-height: .9;
}
.coin span { font-size: 1.15em; }
.coin small { font-size: .52em; font-family: var(--font-body); font-weight: 700; }
.coin.c5 { --d: 2.9em; }
.coin.c5 span { font-size: 1.35em; }
.coin.c10 { --d: 3.3em; background: radial-gradient(circle at 34% 28%, #fff 0, #D9C690 72%); }
.coin.c10 span { font-size: 1.45em; }
.coin.pop { animation: pop .28s ease-out; }
.coin:active { transform: translateY(.1em); box-shadow: 0 .04em 0 var(--lava); }
.purse {
  display: flex; justify-content: center; align-items: center; gap: 1.1em; padding: .5em .8em;
  background: var(--berry); border: .14em solid var(--lava); border-radius: 1em;
}
.purse .coin { font-size: 1.25em; }

/* ---------- end of a round ---------- */
.end { align-items: center; justify-content: center; text-align: center; gap: .9em; }
.burst { position: relative; width: 9em; height: 9em; display: grid; place-items: center; }
.burst > svg { width: 100%; height: 100%; animation: land .8s cubic-bezier(.2, 1.5, .4, 1) both; }
.burst i {
  position: absolute; left: 50%; top: 50%; width: .9em; height: .9em; margin: -.45em;
  background: var(--beak); border: .12em solid var(--lava); border-radius: 50%;
  animation: fly .9s ease-out .25s both;
}
.burst i:nth-child(2) { --dx: -5.6em; --dy: -3.6em; }
.burst i:nth-child(3) { --dx: 5.6em; --dy: -3.6em; background: var(--sea); }
.burst i:nth-child(4) { --dx: -6.2em; --dy: 1.6em; background: var(--lupine); }
.burst i:nth-child(5) { --dx: 6.2em; --dy: 1.6em; }
.burst i:nth-child(6) { --dx: -2.6em; --dy: -6em; background: var(--moss); }
.burst i:nth-child(7) { --dx: 2.6em; --dy: -6em; background: var(--berry); }
.end-title { font-family: var(--font-display); font-weight: 800; font-size: 2.5em; line-height: 1; text-wrap: balance; }
.end-line { font-size: 1.25em; }
.end-line b, .end-up b { font-family: var(--font-display); font-weight: 800; font-size: 1.25em; }
.end-up {
  padding: .4em .9em; background: var(--sun); border: .13em solid var(--lava); border-radius: .8em;
  font-size: 1.1em; font-weight: 700;
}
.end-acts { display: grid; grid-template-columns: 1fr 1fr; gap: .7em; width: 100%; margin-top: .6em; }
.end .lopi { align-self: stretch; }

/* ---------- parents ---------- */
.veil { position: fixed; inset: 0; z-index: 10; display: grid; place-items: end center; background: rgba(28, 38, 50, .55); }
.sheet {
  width: min(100%, 34em); max-height: 94%; overflow-y: auto; display: grid; gap: .9em;
  padding: 1em max(1em, 16px) 1.4em; background: var(--wool);
  border: .14em solid var(--lava); border-bottom: 0; border-radius: 1.4em 1.4em 0 0;
  font-size: clamp(15px, 4.1vw, 19px); -webkit-user-select: text; user-select: text;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 1em; }
.sheet h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.5em; line-height: 1.1; }
.note { font-size: .92em; opacity: .8; max-width: 65ch; }
.prow-g {
  display: grid; grid-template-columns: 1fr auto; gap: .15em .8em; align-items: center;
  padding-top: .8em; border-top: .1em solid rgba(28, 38, 50, .14);
}
.prow-g h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.1em; }
.prow-g p { grid-column: 1 / -1; font-size: .9em; opacity: .8; }
.stepper { display: flex; align-items: center; gap: .5em; font-weight: 700; }
.stepper button {
  width: 2.5em; height: 2.5em; border-radius: 50%; border: .12em solid var(--lava); background: var(--mist);
  font-family: var(--font-display); font-weight: 800; font-size: 1.1em; line-height: 1;
}
.stepper button:disabled { opacity: .3; }

function startGame(id) {
  var g = GAMES[id];
  session = { game: g, level: state.games[id].level, i: 0, n: ROUND, first: 0, tries: 0, locked: false, task: null, lastKey: null };
  nextTask();
}
function nextTask() {
  if (!session) return;
  if (session.i >= session.n) { finish(); return; }
  var task, guard = 0;
  do { task = session.game.make(session.level); guard++; } while (task.key === session.lastKey && guard < 12);
  session.task = task; session.lastKey = task.key; session.tries = 0; session.locked = false;
  renderTask();
}
function soundButton() {
  var b = el('button', { class: 'round', type: 'button' });
  function paint() { b.innerHTML = state.sound ? ICON.on : ICON.off; b.setAttribute('aria-label', state.sound ? 'Slökkva á hljóði' : 'Kveikja á hljóði'); }
  b.addEventListener('click', function () { state.sound = !state.sound; save(); paint(); Sound.tap(); });
  paint();
  return b;
}
function renderTask() {
  newScreen();
  var g = session.game, t = session.task;
  var steps = el('div', { class: 'steps', role: 'img', 'aria-label': 'Verkefni ' + (session.i + 1) + ' af ' + session.n });
  for (var k = 0; k < session.n; k++) steps.appendChild(el('i', { class: k < session.i ? 'done' : (k === session.i ? 'now' : '') }));
  ui.steps = steps;
  var v = g.view(t, api);
  var stage = el('div', { class: 'stage game' },
    el('div', { class: 'bar' },
      el('button', { class: 'round', type: 'button', 'aria-label': 'Heim', html: ICON.home, onclick: function () { Sound.tap(); renderHome(); } }),
      steps, soundButton()),
    talkRow(v.ask),
    el('div', { class: 'play' }, v.body),
    v.acts ? el('div', { class: 'acts' }, v.acts) : null);
  mount(stage);
  if (v.ready) v.ready();
}
function finish() {
  var id = session.game.id, g = state.games[id], n = session.n, f = session.first, up = 0;
  g.plays++; g.tasks += n; g.first += f;
  state.stars++;
  if (state.auto) {
    if (f === n || (f >= n - 1 && g.streak >= 1)) { g.streak = 0; if (g.level < 4) { g.level++; up = g.level; } }
    else if (f >= n - 1) g.streak = 1;
    else { g.streak = 0; if (f <= 2 && g.level > 1) g.level--; }
  }
  state.log.push({ g: id, l: session.level, f: f, n: n, t: Date.now() });
  if (state.log.length > 60) state.log = state.log.slice(-60);
  save();
  renderEnd(up);
}
function starWord(n) { return (n % 10 === 1 && n % 100 !== 11) ? 'stjörnu' : 'stjörnur'; }
function renderEnd(up) {
  newScreen();
  var g = session.game;
  session.locked = true;
  var stage = el('div', { class: 'stage end' },
    el('div', { class: 'burst', 'aria-hidden': 'true', html: ART.star + '<i></i><i></i><i></i><i></i><i></i><i></i>' }),
    el('h1', { class: 'end-title', text: 'Lotan búin!' }),
    el('p', { class: 'end-line', html: 'Þú fékkst stjörnu! Nú áttu <b>' + state.stars + '</b> ' + starWord(state.stars) + '.' }),
    up ? el('p', { class: 'end-up', html: g.name + ': þrep <b>' + up + '</b> er opið!' }) : null,
    el('div', { class: 'end-acts' },
      el('button', { class: 'big', type: 'button', text: 'Aftur', onclick: function () { Sound.tap(); startGame(g.id); } }),
      el('button', { class: 'big quiet', type: 'button', text: 'Heim', onclick: function () { Sound.tap(); renderHome(); } })));
  mount(stage);
  Sound.win();
}

/* ================= shared answer row ================= */
function options(correct, k, lo, hi) {
  var set = [correct];
  [[correct - 1, correct + 1], [correct - 2, correct + 2], [correct - 3, correct + 3], [correct - 4, correct + 4]].forEach(function (pair) {
    shuffle(pair).forEach(function (v) { if (set.length < k && v >= lo && v <= hi && set.indexOf(v) < 0) set.push(v); });
  });
  return set.sort(function (a, b) { return a - b; });
}
function choiceRow(opts, onPick) {
  var row = el('div', { class: 'choices', style: '--k:' + opts.length });
  opts.forEach(function (v) {
    var b = el('button', { class: 'choice', type: 'button', text: String(v) });
    b.addEventListener('click', function () { if (api.locked() || b.disabled) return; onPick(v, b); });
    row.appendChild(b);
  });
  row.hint = function (v) {
    Array.prototype.forEach.call(row.children, function (b) { if (b.textContent === String(v)) b.classList.add('hint'); });
  };
  return row;
}

/* ================= the five games ================= */
var DICE = {
  1: [[.5, .5]], 2: [[.3, .3], [.7, .7]], 3: [[.26, .26], [.5, .5], [.74, .74]],
  4: [[.3, .3], [.7, .3], [.3, .7], [.7, .7]], 5: [[.27, .27], [.73, .27], [.5, .5], [.27, .73], [.73, .73]],
  6: [[.3, .24], [.7, .24], [.3, .5], [.7, .5], [.3, .76], [.7, .76]]
};
function dot(x, y, r, fill) {
  return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r + '" fill="' + fill + '" stroke="#1C2632" stroke-width="3"/>';
}
function dotsSvg(t) {
  var s = '', i;
  if (t.kind === 'frame') {
    for (i = 0; i < 10; i++) {
      var x = 12 + (i % 5) * 76, y = 12 + Math.floor(i / 5) * 80;
      s += '<rect x="' + x + '" y="' + y + '" width="72" height="76" rx="13" fill="none" stroke="#1C2632" stroke-opacity=".28" stroke-width="3"/>';
      if (i < t.n) s += dot(x + 36, y + 38, 25, '#5852C4');
    }
    return '<svg viewBox="0 0 400 180" aria-hidden="true">' + s + '</svg>';
  }
  if (t.kind === 'two') {
    DICE[t.a].forEach(function (p) { s += dot(14 + p[0] * 172, 4 + p[1] * 172, 21, '#5852C4'); });
    DICE[t.b].forEach(function (p) { s += dot(214 + p[0] * 172, 4 + p[1] * 172, 21, '#F26A21'); });
    return '<svg viewBox="0 0 400 180" aria-hidden="true">' + s + '</svg>';
  }
  (t.kind === 'dice' ? DICE[t.n] : t.spots).forEach(function (p) { s += dot(p[0] * 200, p[1] * 200, 23, '#5852C4'); });
  return '<svg viewBox="0 0 200 200" aria-hidden="true">' + s + '</svg>';
}
function scatter(n) {
  return shuffle([0, 1, 2, 3, 4, 5, 6, 7, 8]).slice(0, n).map(function (c) {
    return [.22 + (c % 3) * .28 + (Math.random() - .5) * .1, .22 + Math.floor(c / 3) * .28 + (Math.random() - .5) * .1];
  });
}

var GAMES = {
  /* ---- 1. counting out a set ---- */
  lundi: {
    id: 'lundi', name: 'Svangi lundinn', tone: 'var(--sea)', ink: '#fff',
    levels: ['Telja 1–5', 'Telja upp í 10', 'Telja upp í 15', 'Telja upp í 20'],
    make: function (level) {
      var c = [null, { lo: 1, hi: 5, sea: 8, cols: 4, pc: 5 }, { lo: 3, hi: 10, sea: 12, cols: 6, pc: 5 }, { lo: 8, hi: 15, sea: 18, cols: 6, pc: 10 }, { lo: 11, hi: 20, sea: 24, cols: 8, pc: 10 }][level];
      var n = rnd(c.lo, c.hi);
      return { key: 'l' + n, answer: n, n: n, sea: c.sea, cols: c.cols, pc: c.pc };
    },
    view: function (t, api) {
      var given = 0, mode = 0, taken = [], fishes = [];
      var rows = Math.ceil(t.sea / t.pc);
      var plate = el('div', { class: 'plate' + (t.pc === 10 ? ' ten' : ''), role: 'group', 'aria-label': 'Diskur lundans' });
      var sea = el('div', { class: 'sea', style: '--cols:' + t.cols, role: 'group', 'aria-label': 'Sjórinn' });
      function draw(freshAt) {
        plate.replaceChildren();
        for (var r = 0; r < rows; r++) {
          var row = el('div', { class: 'prow' });
          for (var c = 0; c < t.pc; c++) {
            var k = r * t.pc + c;
            if (t.pc === 10 && c === 5) row.appendChild(el('i', { class: 'gap' }));
            var want = mode === 2 && k < t.n;
            if (k < given) {
              var s = el('button', {
                class: 'slot full' + (want ? ' want' : '') + (mode === 2 && k >= t.n ? ' extra' : '') + (k === freshAt ? ' pop' : ''),
                type: 'button', 'aria-label': 'Taka síli til baka',
                html: ART.fish + (mode ? '<span class="n">' + (k + 1) + '</span>' : '')
              });
              s.addEventListener('click', back);
              row.appendChild(s);
            } else {
              row.appendChild(el('i', { class: 'slot' + (want ? ' want' : '') }));
            }
          }
          plate.appendChild(row);
        }
      }
      function give(i) {
        if (api.locked() || fishes[i].disabled) return;
        fishes[i].disabled = true; fishes[i].classList.add('gone');
        taken.push(i); given++;
        Sound.count(given);
        draw(given - 1);
      }
      function back() {
        if (api.locked() || !given) return;
        var i = taken.pop();
        fishes[i].disabled = false; fishes[i].classList.remove('gone');
        given--;
        Sound.tap();
        draw(-1);
      }
      for (var i = 0; i < t.sea; i++) {
        (function (i) {
          var b = el('button', { class: 'fish' + (Math.random() < .5 ? ' flip' : ''), type: 'button', 'aria-label': 'Síli í sjónum', html: ART.fish, style: '--tilt:' + rnd(-9, 9) + 'deg' });
          b.addEventListener('click', function () { give(i); });
          fishes.push(b); sea.appendChild(b);
        })(i);
      }
      draw(-1);
      var check = el('button', { class: 'big', type: 'button', html: ICON.check + '<span>Tilbúið</span>' });
      check.addEventListener('click', function () {
        if (api.locked()) return;
        if (!given) { api.nudge('Ýttu á sílin í sjónum.'); return; }
        if (given === t.n) {
          mode = 1; draw(-1);
          api.right('<b>' + t.n + '</b> síli. Takk!');
        } else {
          var tries = api.wrong('Þetta ' + (given === 1 ? 'er' : 'eru') + ' <b>' + given + '</b>. Lundinn vill <b>' + t.n + '</b>.');
          mode = tries >= 2 ? 2 : 1;
          draw(-1);
        }
      });
      return { ask: 'Gefðu lundanum <b>' + t.n + '</b> síli.', body: [plate, sea], acts: check };
    }
  },

  /* ---- 2. seeing how many without counting ---- */
  punktar: {
    id: 'punktar', name: 'Hvað eru margir?', tone: 'var(--lupine)', ink: '#fff',
    levels: ['1–4 punktar', 'Teningamynstur, 1–6', 'Tíurammi, upp í 10', 'Tveir hópar, upp í 10'],
    make: function (level) {
      var n;
      if (level === 1) { n = rnd(1, 4); return { key: 'p' + n, answer: n, n: n, kind: 'scatter', spots: scatter(n), ms: 2600, k: 3 }; }
      if (level === 2) { n = rnd(1, 6); return { key: 'p' + n, answer: n, n: n, kind: 'dice', ms: 2000, k: 4 }; }
      if (level === 3) { n = rnd(4, 10); return { key: 'p' + n, answer: n, n: n, kind: 'frame', ms: 2600, k: 4 }; }
      var a = rnd(1, 5), b = rnd(1, 5);
      return { key: 'p' + a + '+' + b, answer: a + b, n: a + b, a: a, b: b, kind: 'two', ms: 3000, k: 4 };
    },
    view: function (t, api) {
      var wide = t.kind === 'frame' || t.kind === 'two';
      var card = el('div', { class: 'flash' + (wide ? ' wide' : ''), html: dotsSvg(t) + '<div class="lid" aria-hidden="true">?</div>' });
      var stay = false, showId = 0;
      function show(ms) {
        if (stay) return;
        var id = ++showId;
        card.classList.add('open');
        api.later(function () { if (id === showId && !stay) card.classList.remove('open'); }, ms);
      }
      function keepOpen() { stay = true; card.classList.add('open'); }
      var again = el('button', { class: 'mini', type: 'button', html: ICON.eye + '<span>Sjá aftur</span>' });
      again.addEventListener('click', function () { if (api.locked() || stay) return; Sound.tap(); show(t.ms); });
      var row = choiceRow(options(t.n, t.k, 1, 10), function (v, b) {
        if (v === t.n) {
          keepOpen(); b.classList.add('hit');
          api.right('Þetta ' + (t.n === 1 ? 'er' : 'eru') + ' <b>' + t.n + '</b>.');
        } else {
          b.disabled = true; b.classList.add('out');
          if (api.tries() + 1 >= 2) { api.wrong('Teldu punktana.'); keepOpen(); row.hint(t.n); }
          else { api.wrong('Skoðaðu aftur.'); show(Math.round(t.ms * 1.6)); }
        }
      });
      return {
        ask: 'Hvað eru margir punktar?', body: [card, again], acts: row,
        ready: function () { api.later(function () { show(t.ms); }, 450); }
      };
    }
  },

  /* ---- 3. number bonds ---- */
  vinir: {
    id: 'vinir', name: 'Tíuvinir', tone: 'var(--sun)', ink: 'var(--lava)',
    levels: ['Saman 5', 'Saman 10, með eggjabakka', 'Saman 6–9', 'Tíuvinir eftir minni'],
    make: function (level) {
      var total, have, closed = false;
      if (level === 1) { total = 5; have = rnd(1, 4); }
      else if (level === 2) { total = 10; have = rnd(1, 9); }
      else if (level === 3) { total = rnd(6, 9); have = rnd(1, total - 1); }
      else { total = 10; have = rnd(1, 9); closed = true; }
      return { key: 'v' + total + '-' + have, answer: total - have, total: total, have: have, miss: total - have, closed: closed };
    },
    view: function (t, api) {
      var carton = el('div', { class: 'carton', role: 'img', 'aria-label': t.closed ? 'Lokaður eggjabakki með 10 hólfum' : 'Eggjabakki: ' + t.have + ' egg af ' + t.total });
      var cups = [], lid = null;
      for (var i = 0; i < t.total; i++) {
        var cup = el('div', { class: 'cup' }, i < t.have ? el('i', { class: 'egg' }) : null);
        cups.push(cup); carton.appendChild(cup);
      }
      if (t.closed) { lid = el('div', { class: 'lid', html: '<span>10</span>' }); carton.appendChild(lid); }
      function open() { if (lid) { carton.removeChild(lid); lid = null; } }
      var sum = el('div', { class: 'sum', html: t.have + ' + <span class="q">?</span> = ' + t.total });
      var row = choiceRow(options(t.miss, 4, 1, t.total === 5 ? 5 : 9), function (v, b) {
        if (v === t.miss) {
          open(); b.classList.add('hit');
          cups.slice(t.have).forEach(function (c, j) {
            c.classList.remove('want');
            var e = el('i', { class: 'egg gold' }); e.style.animationDelay = (j * 80) + 'ms'; c.appendChild(e);
          });
          sum.innerHTML = t.have + ' + <span class="q got">' + t.miss + '</span> = ' + t.total;
          api.right(t.total === 10 ? '<b>' + t.have + '</b> og <b>' + t.miss + '</b> eru tíuvinir!' : '<b>' + t.have + '</b> og <b>' + t.miss + '</b> eru saman <b>' + t.total + '</b>!', 2300);
        } else {
          b.disabled = true; b.classList.add('out');
          open();
          if (api.tries() + 1 >= 2) {
            cups.slice(t.have).forEach(function (c) { c.classList.add('want'); });
            api.wrong('Teldu tómu hólfin.'); row.hint(t.miss);
          } else api.wrong(t.closed ? 'Kíktu í bakkann. Prófaðu aftur.' : 'Prófaðu aftur.');
        }
      });
      return { ask: t.closed ? '<b>' + t.have + '</b> og hvað eru <b>10</b>?' : 'Hvað vantar mörg egg?', body: [carton, sum], acts: row };
    }
  },

  /* ---- 4. adding and taking away on a number line ---- */
  kind: {
    id: 'kind', name: 'Kindahopp', tone: 'var(--moss)', ink: '#fff',
    levels: ['Plús 1–2, upp í 5', 'Plús, upp í 10', 'Plús og mínus, upp í 10', 'Plús og mínus, upp í 20'],
    make: function (level) {
      var lo = 0, n, start, d;
      if (level === 1) { n = 6; d = rnd(1, 2); start = rnd(0, 5 - d); }
      else if (level === 2) { n = 11; d = rnd(1, 3); start = rnd(0, 10 - d); }
      else if (level === 3) {
        n = 11; d = rnd(1, 4);
        if (Math.random() < .5) { start = rnd(d, 10); d = -d; } else start = rnd(0, 10 - d);
      } else {
        n = 9; d = rnd(1, 5);
        if (Math.random() < .5) { start = rnd(Math.max(d, 8), 20); d = -d; } else start = rnd(6, 20 - d);
        var a = Math.min(start, start + d), b = Math.max(start, start + d);
        lo = rnd(Math.max(0, b - 8), Math.min(a, 12));
      }
      return { key: 'k' + start + (d > 0 ? '+' : '') + d, answer: start + d, lo: lo, n: n, start: start, d: d, end: start + d };
    },
    view: function (t, api) {
      var fwd = t.d > 0, k = Math.abs(t.d), op = fwd ? '+' : '−';
      var btns = [];
      var stones = el('div', { class: 'stones', style: '--n:' + t.n });
      function at(v) { return v - t.lo; }
      var sheep = el('div', { class: 'sheep' + (fwd ? '' : ' back'), html: '<div class="sheep-in">' + ART.sheep + '</div>' });
      function place(i) { sheep.style.setProperty('--i', i); sheep.classList.toggle('low', i % 2 === 1); }
      function hopTo(i) { place(i); wiggle(sheep.firstChild, 'hop'); Sound.hop(); }
      function marks() {
        for (var s = 1; s <= k; s++) {
          var b = btns[at(t.start + (fwd ? s : -s))];
          if (b && !b.querySelector('.mark')) b.appendChild(el('i', { class: 'mark', text: String(s) }));
        }
      }
      var ask = 'Kindin hoppar <b>' + k + '</b> ' + (fwd ? 'áfram' : 'til baka') + '. Hvar lendir hún?';
      function tap(v, b) {
        if (api.locked()) return;
        if (v === t.start) { wiggle(sheep.firstChild, 'hop'); api.nudge(ask); return; }
        if (v === t.end) {
          btns.forEach(function (x) { x.classList.remove('hint'); });
          b.classList.add('hit');
          for (var s = 1; s <= k; s++) {
            (function (s) { api.later(function () { hopTo(at(t.start + (fwd ? s : -s))); }, (s - 1) * 380 + 60); })(s);
          }
          api.right('<b>' + t.start + ' ' + op + ' ' + k + ' = ' + t.end + '</b>', k * 380 + 1700);
        } else {
          wiggle(b, 'shake');
          var tries = api.wrong('Teldu hoppin.');
          marks();
          if (tries >= 2) btns[at(t.end)].classList.add('hint');
        }
      }
      for (var i = 0; i < t.n; i++) {
        (function (i) {
          var v = t.lo + i;
          var b = el('button', {
            class: 'stone' + (i % 2 ? ' low' : '') + (v === t.start ? ' start' : '') + (v > 9 ? ' two' : ''),
            type: 'button', text: String(v), 'aria-label': 'Steinn ' + v, style: 'grid-column:' + (i + 1) + ' / span 2'
          });
          b.addEventListener('click', function () { tap(v, b); });
          btns.push(b); stones.appendChild(b);
        })(i);
      }
      place(at(t.start));
      stones.appendChild(sheep);
      var field = el('div', { class: 'field' },
        el('div', { class: 'sign', 'aria-hidden': 'true', html: fwd ? '<span>+' + k + '</span>' + ICON.fwd : ICON.back + '<span>−' + k + '</span>' }),
        el('div', { class: 'stream' }, stones));
      return { ask: ask, body: field, acts: null };
    }
  },

  /* ---- 5. paying with coins ---- */
  bud: {
    id: 'bud', name: 'Búðin', tone: 'var(--berry)', ink: '#fff',
    levels: ['1–5 kr. með krónum', 'Tvær vörur, upp í 10 kr.', '5 kr. peningur, upp í 12 kr.', '1, 5 og 10 kr., upp í 20 kr.'],
    make: function (level) {
      var w = shuffle(WARES), a, b;
      if (level === 1) { a = rnd(1, 5); return { key: 'b' + a, answer: a, items: [{ w: w[0], p: a }], total: a, coins: [1], cap: 10 }; }
      if (level === 2) { a = rnd(1, 5); b = rnd(1, Math.min(5, 10 - a)); return { key: 'b' + a + '+' + b, answer: a + b, items: [{ w: w[0], p: a }, { w: w[1], p: b }], total: a + b, coins: [1], cap: 15 }; }
      if (level === 3) { a = rnd(5, 12); return { key: 'b' + a, answer: a, items: [{ w: w[0], p: a }], total: a, coins: [5, 1], cap: 16 }; }
      a = rnd(4, 12); b = rnd(3, Math.min(9, 20 - a));
      return { key: 'b' + a + '+' + b, answer: a + b, items: [{ w: w[0], p: a }, { w: w[1], p: b }], total: a + b, coins: [10, 5, 1], cap: 20 };
    },
    view: function (t, api) {
      var paid = [];
      var shelf = el('div', { class: 'shelf' });
      t.items.forEach(function (it, i) {
        if (i) shelf.appendChild(el('span', { class: 'plus', 'aria-hidden': 'true', text: '+' }));
        shelf.appendChild(el('div', { class: 'ware', role: 'img', 'aria-label': it.w[0] + ', ' + it.p + ' krónur', html: it.w[1] + '<span class="tag">' + it.p + ' kr.</span>' }));
      });
      var till = el('div', { class: 'till' + (t.coins.length === 1 ? ' fives' : ''), role: 'group', 'aria-label': 'Borðið' });
      function coin(v, extra, label) {
        return el('button', { class: 'coin c' + v + (extra ? ' ' + extra : ''), type: 'button', 'aria-label': label, html: '<span>' + v + '</span><small>kr.</small>' });
      }
      function draw(freshAt) {
        till.replaceChildren();
        if (!paid.length) { till.appendChild(el('span', { class: 'till-empty', text: 'Borðið' })); return; }
        paid.forEach(function (v, i) {
          var c = coin(v, i === freshAt ? 'pop' : '', 'Taka ' + v + ' kr. til baka');
          c.addEventListener('click', function () { if (api.locked()) return; paid.splice(i, 1); Sound.tap(); draw(-1); });
          till.appendChild(c);
        });
      }
      function put(v) {
        if (api.locked()) return;
        if (paid.length >= t.cap) { wiggle(till, 'shake'); return; }
        var i = 0;
        while (i < paid.length && paid[i] >= v) i++;
        paid.splice(i, 0, v);
        Sound.count(paid.length);
        draw(i);
      }
      var purse = el('div', { class: 'purse', role: 'group', 'aria-label': 'Veskið' });
      t.coins.forEach(function (v) {
        var c = coin(v, '', 'Setja ' + v + ' kr. á borðið');
        c.addEventListener('click', function () { put(v); });
        purse.appendChild(c);
      });
      var pay = el('button', { class: 'big', type: 'button', html: ICON.check + '<span>Borga</span>' });
      pay.addEventListener('click', function () {
        if (api.locked()) return;
        var sum = paid.reduce(function (x, y) { return x + y; }, 0);
        if (!sum) { api.nudge('Settu peninga á borðið.'); return; }
        if (sum === t.total) {
          api.right(t.items.length > 1 ? '<b>' + t.items[0].p + ' + ' + t.items[1].p + ' = ' + t.total + '</b> kr. Takk fyrir!' : '<b>' + t.total + '</b> kr. Takk fyrir!', 2100);
        } else {
          var msg = sum < t.total ? 'Of lítið. Bættu við.' : 'Of mikið. Taktu til baka.';
          if (api.tries() + 1 >= 2) msg = 'Þú ert með <b>' + sum + '</b> kr. Þetta kostar <b>' + t.total + '</b> kr.';
          api.wrong(msg);
          wiggle(till, 'shake');
        }
      });
      draw(-1);
      return {
        ask: t.items.length > 1 ? 'Hvað kostar þetta samtals? Borgaðu!' : 'Þetta kostar <b>' + t.total + '</b> kr. Borgaðu!',
        body: [shelf, till, purse], acts: pay
      };
    }
  }
};

/* ================= home ================= */
function tile(g) {
  var lv = state.games[g.id].level, pips = '<span>Þrep ' + lv + '</span>';
  for (var i = 1; i <= 4; i++) pips += '<i' + (i <= lv ? ' class="on"' : '') + '></i>';
  return el('button', {
    class: 'tile', type: 'button', style: '--tone:' + g.tone + ';--ink:' + g.ink,
    'aria-label': g.name + ', þrep ' + lv + ' af 4',
    onclick: function () { Sound.tap(); startGame(g.id); }
  },
    el('span', { class: 'tile-art', html: TILE_ART[g.id] }),
    el('span', { class: 'tile-name', text: g.name }),
    el('span', { class: 'pips', 'aria-hidden': 'true', html: pips }));
}
function renderHome() {
  newScreen();
  session = null;
  var stage = el('div', { class: 'stage home' },
    el('header', { class: 'home-head' },
      el('h1', { class: 'brand', html: 'Talna<span>land</span>' }),
      el('div', { class: 'pill', role: 'img', 'aria-label': state.stars + ' ' + starWord(state.stars), html: ART.star + '<span>' + state.stars + '</span>' }),
      el('button', { class: 'round', type: 'button', 'aria-label': 'Fyrir foreldra', html: ICON.sliders, onclick: openParents })),
    el('div', { class: 'lopi', 'aria-hidden': 'true' }),
    talkRow('Hæ! Veldu leik.'),
    el('nav', { class: 'tiles', 'aria-label': 'Leikir' }, ORDER.map(function (id) { return tile(GAMES[id]); })));
  mount(stage);
}

/* ================= parents ================= */
function openParents() {
  Sound.tap();
  var veil = el('div', { class: 'veil', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Fyrir foreldra' });
  var sheet = el('div', { class: 'sheet' });
  var confirming = false;
  function close() { document.removeEventListener('keydown', onKey); if (veil.parentNode) veil.parentNode.removeChild(veil); renderHome(); }
  function onKey(e) { if (e.key === 'Escape') close(); }
  function gameRow(id) {
    var g = GAMES[id], s = state.games[id];
    var stats = s.plays ? 'Lotur: ' + s.plays + ' · Rétt í fyrstu tilraun: ' + Math.round(100 * s.first / Math.max(1, s.tasks)) + '%' : 'Ekki spilað enn';
    function step(d) { return function () { s.level = int(s.level + d, 1, 4); s.streak = 0; save(); paint(); }; }
    return el('div', { class: 'prow-g' },
      el('h3', { text: g.name }),
      el('div', { class: 'stepper' },
        el('button', { type: 'button', text: '−', 'aria-label': g.name + ': lækka þrep', disabled: s.level <= 1, onclick: step(-1) }),
        el('span', { text: 'Þrep ' + s.level }),
        el('button', { type: 'button', text: '+', 'aria-label': g.name + ': hækka þrep', disabled: s.level >= 4, onclick: step(1) })),
      el('p', { text: g.levels[s.level - 1] + ' · ' + stats }));
  }
  function option(id, label, on, set) {
    var box = el('input', { type: 'checkbox', id: id });
    box.checked = on;
    box.addEventListener('change', function () { set(box.checked); save(); });
    return el('label', { class: 'opt', for: id }, box, el('span', { text: label }));
  }
  function paint() {
    var keepTop = sheet.scrollTop;
    sheet.replaceChildren(
      el('div', { class: 'sheet-head' }, el('h2', { text: 'Fyrir foreldra' }), el('button', { class: 'mini', type: 'button', text: 'Loka', onclick: close })),
      el('p', { class: 'note', text: 'Hver lota er 6 verkefni og gefur eina stjörnu. Þrepið hækkar þegar vel gengur og lækkar ef verkefnin reynast of erfið.' }));
    ORDER.forEach(function (id) { sheet.appendChild(gameRow(id)); });
    sheet.appendChild(option('opt-sound', 'Hljóð', state.sound, function (v) { state.sound = v; }));
    sheet.appendChild(option('opt-auto', 'Þrep breytast sjálfkrafa', state.auto, function (v) { state.auto = v; }));
    var reset = el('div', { class: 'reset' });
    if (confirming) {
      add(reset, [
        el('span', { text: 'Eyða stjörnum og framvindu?' }),
        el('button', { class: 'mini danger', type: 'button', text: 'Já, eyða', onclick: function () { var snd = state.sound; state = fresh(); state.sound = snd; confirming = false; save(); paint(); } }),
        el('button', { class: 'mini', type: 'button', text: 'Hætta við', onclick: function () { confirming = false; paint(); } })]);
    } else {
      reset.appendChild(el('button', { class: 'mini', type: 'button', text: 'Byrja upp á nýtt', onclick: function () { confirming = true; paint(); } }));
    }
    sheet.appendChild(reset);
    sheet.appendChild(el('p', { class: 'note', text: cloud.ok ? 'Framvindan vistast á aðganginum þínum og fylgir þér milli tækja.' : 'Framvindan vistast í þessu tæki.' }));
    sheet.scrollTop = keepTop;
  }
  veil.addEventListener('click', function (e) { if (e.target === veil) close(); });
  document.addEventListener('keydown', onKey);
  paint();
  veil.appendChild(sheet);
  app.appendChild(veil);
}

/* ================= start ================= */
window.__talnaland = {
  get task() { return session ? session.task : null; },
  get state() { return state; }
};
function start(data) {
  try {
    if (data && data.save) { var s = sanitize(data.save); if (s.updated >= state.updated) state = s; }
  } catch (e) {}
  renderHome();
  cloudInit();
}
document.addEventListener('touchstart', function () {}, { passive: true });
var hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(function () { return { save: JSON.parse(JSON.stringify(state)) }; }); } catch (e) {}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
