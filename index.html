<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leikir</title>
<meta name="theme-color" content="#FFF8EE">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;800&family=Andika:wght@400;700&display=swap">
<style>
:root{
  --bg:#FFF8EE; --ink:#24304A; --muted:#6B7590;
  --em:#E2577A; --em-bg:#FDE6EC;
  --br:#6A5AE0; --br-bg:#ECE9FD;
  --display:"Grandstander",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Andika",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);
  min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,8vw,52px);margin:0 0 6px;text-align:center}
p.lead{margin:0 0 32px;color:var(--muted);font-size:20px;text-align:center}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;width:100%;max-width:640px}
a.kid{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:28px 20px 26px;border-radius:28px;text-decoration:none;color:var(--ink);
  background:#fff;border:3px solid transparent;box-shadow:0 6px 0 rgba(36,48,74,.12);
  transition:transform .12s ease,box-shadow .12s ease;
}
a.kid:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(36,48,74,.12)}
a.kid:focus-visible{outline:4px solid var(--ink);outline-offset:4px}
.avatar{
  width:120px;height:120px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:60px;color:#fff;
}
.name{font-family:var(--display);font-weight:800;font-size:32px}
.game{font-size:18px;color:var(--muted)}
.em{border-color:var(--em-bg)} .em .avatar{background:var(--em)}
.br{border-color:var(--br-bg)} .br .avatar{background:var(--br)}
@media (prefers-reduced-motion:reduce){a.kid{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Hver ert þú?</h1>
  <p class="lead">Veldu þitt nafn til að byrja að spila</p>
  <div class="kids">
    <a class="kid em" href="emelia/">
      <span class="avatar" aria-hidden="true">E</span>
      <span class="name">Emelía</span>
      <span class="game">Lærileikir 🌷</span>
    </a>
    <a class="kid br" href="briet/">
      <span class="avatar" aria-hidden="true">B</span>
      <span class="name">Bríet</span>
      <span class="game">Talnaland 🪻</span>
    </a>
  </div>
</main>
</body>
</html>
