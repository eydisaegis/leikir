<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lærileikir Emelíu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@300..800&display=swap">
<style>
:root{
  /* Reikningsbók: rúðustrikað blað, blátt blek, gult málband, rauður blýantur.
     Einn dálkur fyrir síma. Málbandið er eina háværa atriðið, allt annað er hljóðlátt. */
  --paper:#F5F8FC;
  --grid:#DCE5F1;
  --ink:#18274A;
  --ink-2:#55627E;
  --line:#C5D0E2;
  --card:#FFFFFF;
  --tape:#FFD043;
  --pencil:#E2463A;
  --good:#1E9B5E; --good-bg:#DFF5E8; --good-ink:#0E6A3E;
  --retry:#DE7A1E; --retry-bg:#FFEFDD; --retry-ink:#94480A;
  --hue:#2D6FE0; --tint:#E1EBFC;
  --display:"Shantell Sans","Chalkboard SE","Comic Sans MS","Marker Felt",system-ui,sans-serif;
  --body:"Andika",Verdana,"Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{touch-action:manipulation}
body{
  font-family:var(--body);font-size:17px;line-height:1.45;color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;margin:0}
:focus-visible{outline:3px solid #2D6FE0;outline-offset:2px}
#app{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column}
svg{display:block}

/* ---------- heim ---------- */
.home{flex:1;min-height:0;overflow-y:auto;padding:22px 16px 28px;display:flex;flex-direction:column;gap:22px}
.eyebrow{margin:0;font:700 13px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.hero{display:flex;flex-direction:column;gap:6px}
.hero h1{margin:2px 0 0;font:800 42px/1 var(--display);letter-spacing:-.01em}
.hero h1 span{display:block}
.hero h1 .who{
  display:inline-block;
  -webkit-text-decoration:underline wavy var(--pencil);text-decoration:underline wavy var(--pencil);
  text-decoration-thickness:3px;text-underline-offset:7px;padding-bottom:10px;
}
.startape{width:100%;height:auto;margin-top:12px}
.tape-num{font:700 12px var(--body);fill:var(--ink)}
.tapecap{margin:0;font-size:16px;color:var(--ink-2)}
.tapecap b{color:var(--ink);font-size:21px}
.group{display:flex;flex-direction:column;gap:10px}
.group h2{margin:0;font:700 13px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.games{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:13px}
.game{
  width:100%;display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;
  background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:10px 12px 10px 10px;box-shadow:0 4px 0 var(--ink);
}
.game:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.game .ico{width:60px;height:60px;border-radius:10px;background:var(--tint);display:block;overflow:hidden}
.game .txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.game .pg{font:700 12px/1.3 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.game .name{font:700 21px/1.15 var(--display)}
.game .blurb{font-size:14.5px;line-height:1.3;color:var(--ink-2)}
.game .stars{display:flex;gap:1px}
.star path{fill:#fff;stroke:var(--ink);stroke-width:1.7}
.star.on path{fill:var(--tape)}
.note{margin:0;font-size:14px;color:var(--ink-2)}

/* ---------- leikjaskjár ---------- */
.game-screen{flex:1;min-height:0;display:flex;flex-direction:column}
.bar{display:grid;grid-template-columns:40px minmax(0,1fr) auto;column-gap:10px;row-gap:7px;align-items:center;padding:8px 16px 0}
.back{width:40px;height:40px;display:grid;place-items:center;padding:0;border:2px solid var(--ink);border-radius:12px;background:var(--card);box-shadow:0 3px 0 var(--ink)}
.back:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.bar-title{font:700 19px/1.1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-count{font:700 15px var(--body);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.progress{grid-column:1/-1;height:11px;border:2px solid var(--ink);border-radius:4px;background:#fff;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(24,39,74,.5) 10px 11.5px),var(--tape);transition:width .35s ease}
.body{flex:1;min-height:0;overflow-y:auto;padding:10px 16px 8px;display:flex;flex-direction:column;gap:10px}
.prompt:empty,.answer:empty,.lower:empty{display:none}
.prompt h2{margin:0;font:700 22px/1.2 var(--display);text-wrap:balance}
.prompt p{margin:3px 0 0;font-size:16px;line-height:1.35;color:var(--ink-2)}
.stage,.answer,.lower{display:flex;flex-direction:column;gap:10px}
.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px}
.dock{padding:4px 16px 12px;display:flex;flex-direction:column;gap:8px}
.feedback{min-height:44px;display:flex;align-items:center;border-radius:12px;padding:8px 12px;font-weight:700;font-size:16px;line-height:1.3}
.feedback:empty{visibility:hidden}
.feedback.good{background:var(--good-bg);color:var(--good-ink)}
.feedback.retry{background:var(--retry-bg);color:var(--retry-ink)}
.feedback.show{background:#E4EBF7;color:var(--ink)}
.primary,.secondary{height:54px;border:2px solid var(--ink);border-radius:14px;font:700 21px var(--display);box-shadow:0 4px 0 var(--ink)}
.primary{background:var(--tape)}
.secondary{background:var(--card)}
.primary:active,.secondary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.primary:disabled{background:#EDF0F5;color:#8C97AD;border-color:#B4BFD3;box-shadow:0 4px 0 #B4BFD3;transform:none;cursor:default}
.primary[hidden]{display:none}

/* ---------- svarhnappar ---------- */
.choices{display:grid;gap:10px}
.choices.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.choices.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.choices.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.choices.c6{grid-template-columns:repeat(6,minmax(0,1fr))}
.choice{min-height:50px;padding:6px 8px;border:2px solid var(--ink);border-radius:12px;background:var(--card);font:700 20px/1.15 var(--body);box-shadow:0 3px 0 var(--ink)}
.choices.c4 .choice{font-size:18px;padding:6px 2px}
.choice.long{font-size:17px}
.choice:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.choice.right{background:var(--good-bg);border-color:var(--good);box-shadow:0 3px 0 var(--good);color:var(--good-ink)}
.choice.wrong{background:var(--retry-bg);border-color:var(--retry);box-shadow:0 3px 0 var(--retry);color:var(--retry-ink);animation:shake .35s}
.choice:disabled{cursor:default}
.ask2{margin:2px 0 0;font:700 19px/1.25 var(--display)}

/* ---------- talnaborð og dæmi ---------- */
.pad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.15fr);grid-template-rows:46px 46px;gap:8px}
.pad button{padding:0;border:2px solid var(--ink);border-radius:12px;background:var(--card);font:700 24px var(--body);box-shadow:0 3px 0 var(--ink)}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pad .del{grid-column:6;grid-row:1 / span 2;display:grid;place-items:center;background:#EDF0F5}
.pad.locked{opacity:.45;pointer-events:none}
.eq{display:flex;align-items:center;justify-content:center;gap:10px;font:700 28px/1 var(--body);font-variant-numeric:tabular-nums}
.eq .op{color:var(--ink-2)}
.eq small{font-size:20px}
.eq .slot{min-width:92px;height:48px;display:flex;align-items:center;justify-content:center;padding:0 10px;border:2.5px solid var(--ink);border-radius:10px;background:#fff}
.eq .slot.on::after{content:"";width:2.5px;height:26px;margin-left:3px;background:var(--ink);animation:blink 1s steps(1) infinite}
.eq .slot.good{border-color:var(--good);background:var(--good-bg);color:var(--good-ink)}
.eq .slot.bad{border-color:var(--retry);animation:shake .35s}
.cols{align-self:center;display:grid;grid-template-columns:28px repeat(3,60px);row-gap:1px;justify-items:center;align-items:center;margin:0 auto;font:700 26px/1.2 var(--body);font-variant-numeric:tabular-nums}
.cols .lab{font:700 11.5px/1.2 var(--body);color:var(--ink-2);padding-bottom:2px}
.cols .rule{grid-column:1/-1;justify-self:stretch;height:2.5px;background:var(--ink);border-radius:2px;margin:2px 0}
.cols .q{color:var(--ink-2)}
.cols .sum{color:var(--good-ink)}
.cols .pm{color:var(--ink-2)}

/* ---------- hæðarmæling ---------- */
.wall,.chart,.scarves,.model{width:100%;height:auto}
.wall-lab{font:700 13px var(--body);fill:var(--ink)}
.kid-in{animation:kid-in .32s ease-out}
.tally{display:flex;flex-direction:column;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--card)}
.tally-head,.tally-row{display:grid;grid-template-columns:minmax(0,1fr) 116px 46px;align-items:center}
.tally-head{background:var(--tint);font:700 12px/1.2 var(--body);letter-spacing:.02em}
.tally-head span{padding:7px 6px}
.tally-head span:first-child{padding-left:10px}
.tally-row{min-height:40px;width:100%;padding:0;border:0;border-top:1.5px solid var(--line);background:var(--card);text-align:left;cursor:default}
.tally-row .cat{padding:5px 6px 5px 10px;font:700 14.5px/1.25 var(--body)}
.tally-row .marks{align-self:stretch;display:flex;align-items:center;padding:0 8px;border-left:1.5px solid var(--line);border-right:1.5px solid var(--line)}
.tally-row .num{text-align:center;font:700 22px var(--body)}
.tally.tappable .tally-row{cursor:pointer;box-shadow:inset 0 -3px 0 rgba(24,39,74,.1)}
.tally.tappable .tally-row:active{background:var(--tint)}
.tally-row.active{background:#FFF3C9;box-shadow:inset 0 0 0 2.5px #D9A400}
.tally-row.right{background:var(--good-bg)}
.tally-row.wrong{background:var(--retry-bg);animation:shake .35s}
.marks-svg line{stroke:var(--ink);stroke-width:2.8;stroke-linecap:round}
.marks-svg .draw{animation:draw .3s ease-out}

/* ---------- súlurit ---------- */
.dots{stroke:#7C89A6;stroke-width:1;stroke-dasharray:1.5 3.5}
.ax-red{stroke:var(--pencil);stroke-width:2.4;stroke-linecap:round}
.ax-ink{stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.ax-num{font:700 13px var(--body);fill:var(--ink)}
.ax-title{font:400 12.5px var(--body);fill:var(--ink-2)}
.ax-cat{font:700 11.5px var(--body);fill:var(--ink)}
.ax-name{font:700 13px var(--body);fill:var(--ink)}
.ax-count{font:700 15px var(--body);fill:var(--ink)}
.countbox{fill:#fff;stroke:var(--line);stroke-width:1.5}
.cell{fill:#fff;stroke:#8A96B0;stroke-width:1}
.cell.on{fill:var(--hue)}
.hit{fill:transparent;cursor:pointer;touch-action:manipulation}
.hit:focus{outline:none}
.hit:focus-visible{outline:3px solid #2D6FE0}
.chart .col{touch-action:none}
.hit.flag{stroke:var(--retry);stroke-width:3;fill:rgba(222,122,30,.1)}
.hit.best{stroke:var(--good);stroke-width:3;fill:rgba(30,155,94,.1)}
.stick{stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
.dot{fill:var(--ink)}
.band{fill:transparent}
.band.sel{fill:rgba(255,208,67,.55);stroke:var(--ink);stroke-width:2}
.band.right{fill:var(--good-bg)}
.band.wrong{fill:var(--retry-bg)}

/* ---------- málbandið ---------- */
.sign{align-self:center;position:relative;margin-bottom:14px;padding:2px 20px 4px;border:2.5px solid var(--ink);border-radius:10px;background:var(--card);box-shadow:0 3px 0 var(--ink);font:700 22px/1.2 var(--body)}
.sign b{font-size:40px;font-variant-numeric:tabular-nums;margin-right:4px}
.sign::after{content:"";position:absolute;left:50%;top:100%;width:9px;height:13px;margin:3px 0 0 -4.5px;background:#B98744;border:2px solid var(--ink);border-top:0}
.mini{width:100%;height:auto;touch-action:none;cursor:pointer}
.mini-lab{font:700 12px var(--body);fill:var(--ink)}
.zoom{position:relative;height:104px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--card);touch-action:none;cursor:grab;box-shadow:0 4px 0 var(--ink)}
.zoom.grab{cursor:grabbing}
.strip{position:absolute;left:50%;top:0;max-width:none}
.needle{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--pencil);pointer-events:none}
.needle::before{content:"";position:absolute;left:50%;top:0;margin-left:-9px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:13px solid var(--pencil)}
.tape-lab{font:700 16px var(--body);fill:var(--ink)}
.tape-hint{font:700 12px var(--body);fill:#5E4800}
.nudges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nudge{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;font-size:18px}

/* ---------- treflar og orðadæmi ---------- */
.tag-t{font:700 15px var(--body);fill:var(--ink)}
.story{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--hue);border-radius:10px;padding:8px 12px;font-size:17.5px;line-height:1.38}
.story p{margin:0}
.story .q{margin-top:5px;font-weight:700}
.model-name{font:700 13px var(--body);fill:var(--ink)}
.model-num{font:700 15px var(--body);fill:var(--ink)}
.model-q{font:700 20px var(--display);fill:var(--pencil)}

/* ---------- frádráttur með láni ---------- */
.cols{justify-content:center;text-align:center}
.cols.sub .new{height:22px;font:700 16px/22px var(--body);color:#2D6FE0}
.cols.sub b{display:inline-block;min-width:.95em;padding:0 .08em;font-weight:700}
.cols.sub .gone{color:#8C97AD;background:linear-gradient(to top right,transparent calc(50% - 1.6px),var(--pencil) calc(50% - 1.6px),var(--pencil) calc(50% + 1.6px),transparent calc(50% + 1.6px))}
.cols.sub .on{min-width:46px;border-radius:8px;background:#FFF3C9;box-shadow:0 0 0 2.5px var(--ink)}
.cols.big{grid-template-columns:30px repeat(3,66px);font-size:34px}
.cols.big .new{font-size:18px}
.wide{width:100%}
.bars{touch-action:none}
@media (max-height:640px){
  .cols.big{font-size:30px}
  .choices.c5 .choice{min-height:44px}
}
.eq.big{font-size:34px}
.eq.big .slot{min-width:104px;height:54px}
.eq.unit{font-size:24px;gap:8px}

/* ---------- reglustikan ---------- */
.rulerscene{width:100%;height:auto}
.ruler-hit{fill:transparent}
.ruler-num{font:700 13px var(--body);fill:var(--ink)}
.guide{stroke:var(--pencil);stroke-width:1.8;stroke-dasharray:4 3}
.stick-t{font:700 12px var(--body);fill:var(--ink)}

/* ---------- talnalínan ---------- */
.cards{display:flex;gap:8px;justify-content:center}
.card{min-width:54px;padding:5px 6px;border:2px solid var(--ink);border-radius:8px;background:var(--card);font:700 20px/1.2 var(--body);text-align:center;font-variant-numeric:tabular-nums}
.card.now{background:#FFF3C9;box-shadow:0 3px 0 var(--ink)}
.card.done{background:var(--good-bg);border-color:var(--good);color:var(--good-ink)}
.card.wait{color:var(--ink-2);border-color:var(--line)}
.zoom.line{height:98px}
.needle.blue{background:#2D6FE0}
.needle.blue::before{border-top-color:#2D6FE0}
.needle.faint{opacity:.22}
.line-lab{font:700 16px var(--body);fill:var(--ink)}
.flag-t{font:700 12.5px var(--body);fill:var(--good-ink)}

/* ---------- úrslit ---------- */
.result{flex:1;min-height:0;overflow-y:auto;padding:40px 20px 28px;display:flex;flex-direction:column;gap:12px}
.bigstars{display:flex;gap:6px;margin:8px 0 6px -4px}
.bigstars .star.on{animation:pop .5s cubic-bezier(.2,1.6,.4,1) backwards}
.result h1{margin:0;font:800 36px/1.05 var(--display)}
.result .lead{margin:0;font-size:18px;max-width:30em}
.result .line{margin:0;color:var(--ink-2)}
.result .best{margin:0;font-weight:700;color:var(--good-ink)}
.result-actions{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}}
@keyframes kid-in{from{transform:translateX(70px);opacity:0}}
@keyframes draw{from{stroke-dasharray:44;stroke-dashoffset:44}to{stroke-dasharray:44;stroke-dashoffset:0}}
@media (max-height:640px){
  .bar{padding-top:6px;row-gap:5px}
  .body{padding-top:8px;gap:8px}
  .stage,.answer,.lower{gap:8px}
  .prompt h2{font-size:20px}
  .prompt p{font-size:15px}
  .feedback{min-height:40px;font-size:15px}
  .primary,.secondary{height:48px}
  .wall,.model{width:84%;margin:0 auto}
  .sign b{font-size:34px}
  .story{font-size:16px;padding:6px 10px}
  .pad{grid-template-rows:42px 42px}
  .eq{font-size:26px}
  .eq .slot{height:44px}
  .dock{padding-bottom:10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app"><noscript>Kveiktu á JavaScript til að spila leikina.</noscript></div>
<script>
(() => {
'use strict';

/* ================= stillingar ================= */
const CONFIG = { owner: 'Emelíu', key: 'laerileikir-v1' };

const NS = 'http://www.w3.org/2000/svg';
const app = document.getElementById('app');
const calm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const INK = '#18274A', RED = '#E2463A', TAPE = '#FFD043';

/* ================= smíðatól ================= */
function put(n, attrs, kids){
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'text') n.textContent = v;
    else if (k === 'style') for (const p in v) n.style.setProperty(p, v[p]);
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)){
    if (c == null || c === false) continue;
    n.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return n;
}
const el = (t, a, ...k) => put(document.createElement(t), a, k);
const svg = (t, a, ...k) => put(document.createElementNS(NS, t), a, k);
const swap = (n, ...k) => { n.textContent = ''; return put(n, null, k); };
function art(vb, w, h, html){
  const s = svg('svg', {viewBox: vb, width: w, height: h, 'aria-hidden': 'true'});
  s.innerHTML = html;
  return s;
}
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const once = fn => { let d = false; return () => { if (d) return; d = true; fn(); }; };
const nb = t => String(t).replace(/(\d) (?=\S)/g, '$1\u00a0');   // „140 cm“ brotnar ekki milli lína
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  return 'rgb(' + Math.round(((n >> 16) & 255) * f) + ',' + Math.round(((n >> 8) & 255) * f) + ',' + Math.round((n & 255) * f) + ')';
}

/* ================= staða ================= */
const state = { stars: {}, plays: {} };
function merge(d){
  if (!d || typeof d !== 'object') return;
  for (const k in (d.stars || {})) state.stars[k] = Math.max(state.stars[k] || 0, d.stars[k] | 0);
  for (const k in (d.plays || {})) state.plays[k] = Math.max(state.plays[k] || 0, d.plays[k] | 0);
}

/* Tvær tilraunir. Eftir þá seinni er lausnin sýnd og skýrð. */
function judge(shell, score, o){
  let wrongs = 0, done = false;
  const go = once(o.next);
  return {
    right(msg){
      if (done) return;
      done = true; score.total++; if (wrongs === 0) score.first++;
      shell.say('good', msg || pick(PRAISE));
      shell.action('Áfram', go);
      later(go, 1300);
    },
    wrong(hint){
      if (done) return true;
      wrongs++;
      if (wrongs >= 2){
        done = true; score.total++;
        shell.say('show', o.reveal());
        shell.action('Áfram', go);
        return true;
      }
      shell.say('retry', hint || pick(RETRY));

  };
}

function numpad(maxLen, onChange, onEnter){
  let txt = '', locked = false, stale = false;
  const press = d => {
    if (locked) return;
    if (stale){ txt = ''; stale = false; }
    if (txt === '0') txt = '';
    if (txt.length >= maxLen) return;
    txt += d; onChange(txt);
  };
  const back = () => {
    if (locked) return;
    if (stale){ txt = ''; stale = false; } else txt = txt.slice(0, -1);
    onChange(txt);
  };
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'].map(d => el('button', {type: 'button', text: d, onclick: () => press(d)}));
  const del = el('button', {type: 'button', class: 'del', 'aria-label': 'Stroka út', onclick: back},
    art('0 0 28 24', 30, 26, '<path d="M9 3h15a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H9l-7-9z" fill="none" stroke="#18274A" stroke-width="2.2" stroke-linejoin="round"/><path d="M13 8.5l7 7M20 8.5l-7 7" stroke="#18274A" stroke-width="2.2" stroke-linecap="round"/>'));
  const box = el('div', {class: 'pad'}, keys.slice(0, 5), del, keys.slice(5));
  const api = {
    el: box, press, back,
    value: () => (txt && !stale) ? parseInt(txt, 10) : null,
    lock(){ locked = true; box.classList.add('locked'); if (activePad === api) activePad = null; },
    stale(){ stale = true; },
    enter(){ if (!locked && txt && !stale) onEnter(); }
  };
  activePad = api;
  return api;
}
document.addEventListener('keydown', e => {
  if (activeDigits && /^[0-9]$/.test(e.key)){ activeDigits(+e.key); return; }
  if (!activePad) return;
  if (/^[0-9]$/.test(e.key)) activePad.press(e.key);
  else if (e.key === 'Backspace') activePad.back();
  else if (e.key === 'Enter'){ e.preventDefault(); activePad.enter(); }
});

function columns(a, b, withSum){

/* Svar slegið inn á talnaborð og athugað.
   o: answer, slot, next, hint (texti eða fall af svarinu), shown (texti þegar lausnin er sýnd),
      help(done) og right() ef eitthvað á að gerast á skjánum, len = mesti fjöldi tölustafa. */
function askNumber(shell, score, o){
  const j = judge(shell, score, {
    next: o.next,
    reveal(){
      o.slot.textContent = o.answer; o.slot.className = 'slot good'; pad.lock();
      if (o.help) o.help(true);
      return o.shown;
    }
  });
  const check = () => {
    const v = pad.value();
    if (v == null) return;
    if (v === o.answer){ o.slot.className = 'slot good'; pad.lock(); if (o.right) o.right(); j.right(); return; }
    o.slot.classList.remove('bad'); void o.slot.offsetWidth; o.slot.classList.add('bad');
    pad.stale(); shell.enable(false);
    if (!j.wrong(typeof o.hint === 'function' ? o.hint(v) : o.hint) && o.help) o.help(false);
  };
  const pad = numpad(o.len || 3, txt => { o.slot.textContent = txt; o.slot.className = 'slot on'; shell.enable(txt.length > 0); }, check);
  swap(shell.answer, pad.el);
  shell.action('Athuga', check, false);
}
/* Samlagning með dálkahjálp. Notað í Treflunum, Orðadæmum og Reiknaðu dæmin. */
function askSum(shell, score, o){
  const sum = o.a + o.b, ones = (o.a % 10) + (o.b % 10), carry = ones > 9;
  askNumber(shell, score, {
    answer: sum, slot: o.slot, next: o.next, help: o.help,
    hint: v => (o.mixed && v === Math.abs(o.a - o.b)) ? 'Þetta er plúsdæmi. Leggðu saman.' : carry ? 'Ekki alveg. Mundu að geyma.' : 'Ekki alveg. Skoðaðu dálkana.',
    shown: o.a + ' + ' + o.b + ' = ' + sum + '. ' + (carry ? 'Einingarnar: ' + (o.a % 10) + ' + ' + (o.b % 10) + ' = ' + ones + '. Þú geymir 1 tug.' : 'Skoðaðu dálkana.')
  });
}

/* Uppsettur frádráttur með láni.
   cur = tölurnar eftir lán, need = dálkar sem þurfa lán, ans = svarið í dálkum, chain = lán yfir núll. */
const digs3 = v => { const s = String(v), o = [null, null, null]; for (let i = 0; i < s.length; i++) o[3 - s.length + i] = +s[i]; return o; };
function subSolve(a, b){
  const top = digs3(a), bot = digs3(b), cur = top.map(v => v == null ? 0 : v), need = [false, false, false], ans = [null, null, null];
  let chain = false;
  for (let c = 2; c >= 0; c--){
    const bv = bot[c] == null ? 0 : bot[c];
    if (cur[c] < bv){
      let k = c - 1;
      while (k > 0 && cur[k] === 0) k--;
      if (k !== c - 1) chain = true;
      for (let m = k; m < c; m++){ cur[m] -= 1; cur[m + 1] += 10; }
      need[c] = true;
    }
    ans[c] = cur[c] - bv;
  }
  for (let c = 0; c < 2 && ans[c] === 0; c++) ans[c] = null;
  return { top, bot, cur, need, ans, chain };
}
/* Dæmið teiknað í dálka. Strikað er yfir tölur sem breytast við lán og nýja talan skrifuð fyrir ofan.
   ans: tölur, '?' eða null í hverjum dálki. at: dálkurinn sem verið er að reikna. */
function subGrid(top, bot, cur, ans, at, big){
  const changed = i => !!cur && top[i] != null && cur[i] !== top[i], three = [0, 1, 2];
  return el('div', {class: 'cols sub' + (big ? ' big' : '')},
    el('span'), el('span', {class: 'lab', text: 'hundruð'}), el('span', {class: 'lab', text: 'tugir'}), el('span', {class: 'lab', text: 'einingar'}),
    el('span'), three.map(i => el('span', {class: 'new', text: changed(i) ? String(cur[i]) : ''})),
    el('span'), three.map(i => el('span', null, top[i] == null ? null : el('b', {class: changed(i) ? 'gone' : null, text: String(top[i])}))),
    el('span', {class: 'pm', text: '−'}), three.map(i => el('span', {text: bot[i] == null ? '' : String(bot[i])})),
    el('span', {class: 'rule'}),
    el('span', {class: 'pm', text: '='}), three.map(i => {
      const t = ans[i] != null ? String(ans[i]) : i === at ? '?' : '';
      return el('span', {class: (t === '?' ? 'q' : 'sum') + (i === at ? ' on' : ''), text: t});
    }));
}

function tallyLines(n, lastCls){

/* Súlurit sem er litað reit fyrir reit. vals er breytt á staðnum.
   Undir hverri súlu standa strikin og fjöldinn úr töflunni. */
function barChart(vals, onChange, tally){
  const W = 340, H = 282, x0 = 46, y0 = 208, ch = 20, cw = 46, slotW = 65.5;
  const colX = j => 50 + j * slotW + (slotW - cw) / 2;
  const s = svg('svg', {viewBox: '0 0 ' + W + ' ' + H, class: 'chart bars', role: 'group', 'aria-label': 'Súlurit'});
  s.append(svg('text', {x: x0, y: 11, 'text-anchor': 'middle', class: 'ax-title', text: 'Fjöldi'}));
  for (let k = 0; k <= 9; k++){
    const y = y0 - k * ch;
    if (k) s.append(svg('line', {x1: x0, y1: y, x2: 316, y2: y, class: 'dots'}));
    s.append(svg('text', {x: x0 - 9, y: y + 4.5, 'text-anchor': 'end', class: 'ax-num', text: String(k)}));
  }
  const cells = [], hits = [];
  let locked = false, pickFn = null, dragging = false;
  const paint = () => { for (let j = 0; j < 4; j++) cells[j].forEach((r, k) => r.classList.toggle('on', k < vals[j])); };
  const cellAt = e => { const b = s.getBoundingClientRect(); return clamp(Math.ceil((y0 - (e.clientY - b.top) * (H / b.height)) / ch), 0, 9); };
  for (let j = 0; j < 4; j++){
    const x = colX(j);
    cells[j] = [];
    for (let k = 1; k <= 9; k++){ const r = svg('rect', {x: x, y: y0 - k * ch, width: cw, height: ch, class: 'cell'}); cells[j].push(r); s.append(r); }
    s.append(
      svg('text', {x: x + cw / 2, y: y0 + 16, 'text-anchor': 'middle', class: 'ax-cat', text: BAR_LABELS[j][0]}),
      svg('text', {x: x + cw / 2, y: y0 + 30, 'text-anchor': 'middle', class: 'ax-cat', text: BAR_LABELS[j][1]}),
      svg('rect', {x: x - 7, y: y0 + 40, width: cw + 14, height: 27, rx: 6, class: 'countbox'}),
      svg('g', {transform: 'translate(' + (x - 5) + ' ' + (y0 + 43) + ') scale(.72)'}, tallyLines(tally[j])),
      svg('text', {x: x + cw + 2, y: y0 + 59, 'text-anchor': 'end', class: 'ax-count', text: String(tally[j])}));
  }
  s.append(
    svg('line', {x1: x0, y1: y0, x2: x0, y2: 26, class: 'ax-red'}),
    svg('path', {d: 'M' + x0 + ' 16L' + (x0 - 5) + ' 27L' + (x0 + 5) + ' 27Z', fill: RED}),
    svg('line', {x1: x0, y1: y0, x2: 334, y2: y0, class: 'ax-ink'}),
    svg('text', {x: 334, y: y0 - 7, 'text-anchor': 'end', class: 'ax-title', text: 'Hæð'}));
  for (let j = 0; j < 4; j++){
    const hit = svg('rect', {x: colX(j) - 8, y: y0 - 9 * ch - 6, width: cw + 16, height: 9 * ch + 9, rx: 6, class: 'hit col', role: 'slider', tabindex: 0, 'aria-label': CATS[j], 'aria-valuemin': 0, 'aria-valuemax': 9, 'aria-valuenow': vals[j]});
    let down = false, last = -1;
    const setTo = v => { vals[j] = clamp(v, 0, 9); hit.setAttribute('aria-valuenow', vals[j]); paint(); onChange(); };
    hit.addEventListener('pointerdown', e => {
      if (locked) return;
      down = true; dragging = true;
      try { hit.setPointerCapture(e.pointerId); } catch (err) {}
      const k = cellAt(e);
      last = k; setTo(k === vals[j] ? k - 1 : k);
      e.preventDefault();
    });
    hit.addEventListener('pointermove', e => {
      if (!down || locked) return;
      const k = cellAt(e);
      if (k !== last){ last = k; setTo(k); }
    });
    const up = () => { down = false; dragging = false; };
    hit.addEventListener('pointerup', up);
    hit.addEventListener('pointercancel', up);
    hit.addEventListener('click', () => { if (locked && pickFn) pickFn(j); });
    hit.addEventListener('keydown', e => {
      if (locked && pickFn && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); pickFn(j); return; }
      if (locked) return;
      if (e.key === 'ArrowUp'){ e.preventDefault(); setTo(vals[j] + 1); }
      if (e.key === 'ArrowDown'){ e.preventDefault(); setTo(vals[j] - 1); }
    });
    hits.push(hit); s.append(hit);
  }
  paint();
  s.addEventListener('touchmove', e => { if (dragging) e.preventDefault(); }, {passive: false});
  return {
    el: s, paint,
    lock(){ locked = true; },
    pick(fn){ pickFn = fn; },
    nope(j){ flash(hits[j], 'flag'); },
    mark(list, cls){ list.forEach(j => hits[j].classList.add(cls)); },
    unmark(){ hits.forEach(h => h.classList.remove('flag', 'best')); }
  };
}

  tag(14, 58, a + ' cm', false);
  tag(326, 66, b + ' cm', true);
  return s;
}

/* Mynd af orðadæminu: tvær súlur og mismunurinn. */
function barModel(sc, x, d){
  const L = 96, R = 328, full = R - L, wa = clamp(full * x / (x + d), 66, full - 58);
  const s = svg('svg', {viewBox: '0 0 340 112', class: 'model', role: 'img', 'aria-label': 'Mynd af dæminu'});
  const bracket = (xa, xb, y, dir, label, cls) => s.append(
    svg('path', {d: 'M' + (xa + 2) + ' ' + (y - 6 * dir) + 'V' + y + 'H' + (xb - 2) + 'V' + (y - 6 * dir), fill: 'none', stroke: INK, 'stroke-width': 1.4}),
    svg('text', {x: (xa + xb) / 2, y: dir < 0 ? y - 6 : y + 20, 'text-anchor': 'middle', class: cls, text: label}));
  bracket(L, L + wa, 22, -1, String(x), 'model-num');
  bracket(L + wa, R, 22, -1, String(d), 'model-num');
  s.append(
    svg('rect', {x: L, y: 28, width: wa, height: 24, rx: 3, fill: '#F29DB3', stroke: INK, 'stroke-width': 1.6}),
    svg('rect', {x: L + wa, y: 28, width: full - wa, height: 24, rx: 3, fill: 'none', stroke: INK, 'stroke-width': 1.4, 'stroke-dasharray': '4 4'}),
    svg('text', {x: L - 8, y: 45, 'text-anchor': 'end', class: 'model-name', text: sc.la || sc.a}),
    svg('rect', {x: L, y: 58, width: full, height: 24, rx: 3, fill: '#8DB6F2', stroke: INK, 'stroke-width': 1.6}),
    svg('text', {x: L - 8, y: 75, 'text-anchor': 'end', class: 'model-name', text: sc.lb || sc.b}));
  bracket(L, R, 88, 1, '?', 'model-q');
  return s;
}

/* ================= leikur 1: hæðarmæling ================= */
function gameHeights(shell, finish){
  const counts = GEN.heightGroups(), kids = GEN.kidsFor(counts);
  const total = kids.length + 7, score = newScore(), tally = [0, 0, 0, 0], vals = [0, 0, 0, 0];
  let step = 0, mode = 'sort', cur = 0, wrongs = 0, busy = false, chart = null, onDigit = null;
  DBG.cur = { kids, counts, tally, vals, get mode(){ return mode; }, get cur(){ return cur; }, get busy(){ return busy; } };
  const PHASE = { sort: 1, count: 2, chart: 3, pick: 4 };
  const tick = () => shell.progress(step, total, 'Skref ' + PHASE[mode] + '/4');

  const S = 2.6, H = 204, Y = h => 6 + (176 - h) * S, CX = 212;
  const wall = svg('svg', {viewBox: '0 0 340 ' + H, class: 'wall', role: 'img', 'aria-label': 'Barn stendur við hæðarmæli'},
    svg('rect', {x: 1, y: 1, width: 338, height: H - 2, rx: 10, fill: '#E8F0FA', stroke: '#C5D0E2', 'stroke-width': 1.5}));
  [160, 150, 140].forEach(v => wall.append(
    svg('line', {x1: 68, y1: Y(v), x2: 332, y2: Y(v), stroke: INK, 'stroke-width': 1.6, 'stroke-dasharray': '7 5'}),
    svg('text', {x: 62, y: Y(v) + 4.5, 'text-anchor': 'end', class: 'wall-lab', text: v + ' cm'})));
  const level = svg('line', {x1: 68, x2: 332, y1: 0, y2: 0, stroke: RED, 'stroke-width': 2.6, 'stroke-linecap': 'round'});
  const spot = svg('g');
  wall.append(level, spot);

  const rows = CATS.map((c, i) => {
    const marks = el('span', {class: 'marks'}), num = el('span', {class: 'num'});
    const row = el('button', {class: 'tally-row', type: 'button', onclick: () => tapRow(i)}, el('span', {class: 'cat', text: c}), marks, num);
    return { row, marks, num };
  });
  const table = el('div', {class: 'tally tappable'},
    el('div', {class: 'tally-head'}, el('span', {text: 'Hæð'}), el('span', {text: 'Talningarstrik'}), el('span', {text: 'Fjöldi'})),
    rows.map(r => r.row));
  const top = el('div', null, wall), bottom = el('div', {class: 'lower'});
  swap(shell.stage, top, table, bottom);
  swap(shell.answer);
  shell.action('', null);

  function drawMarks(i){
    const n = tally[i], w = Math.max(1, Math.ceil(n / 5)) * 40;
    swap(rows[i].marks, svg('svg', {viewBox: '0 0 ' + w + ' 30', width: w, height: 30, role: 'img', 'aria-label': n + ' strik'}, tallyLines(n, 'draw')));
  }
  function tapRow(i){
    if (!busy && mode === 'sort') sortTap(i);
  }

  /* 1. Flokka börnin */
  function showKid(){
    const k = kids[cur];
    wrongs = 0; busy = false;
    swap(spot, svg('g', {class: 'kid-in'}, svg('g', {transform: 'translate(' + CX + ' ' + Y(k.h) + ')'}, kidSVG(k.look, S))));
    level.setAttribute('y1', Y(k.h)); level.setAttribute('y2', Y(k.h));
    shell.ask('Í hvaða flokk fer barnið?', 'Barn ' + (cur + 1) + ' af ' + kids.length + '. Ýttu á réttan flokk.');
    tick();
  }
  function sortTap(i){
    const k = kids[cur];
    if (i === k.cat) return place(wrongs === 0, 'good', pick(PRAISE));
    wrongs++; flash(rows[i].row, 'wrong');
    if (wrongs >= 2) place(false, 'show', 'Rauða strikið sýnir að barnið er ' + CAT_SAY[k.cat] + '.');
    else shell.say('retry', 'Skoðaðu rauða strikið. Hvar er það miðað við línurnar?');
  }
  function place(first, kind, msg){
    const k = kids[cur];
    busy = true; score.total++; if (first) score.first++;
    tally[k.cat]++; drawMarks(k.cat); flash(rows[k.cat].row, 'right', 700);
    shell.say(kind, msg); step++; tick();
    later(() => {
      cur++;
      if (cur < kids.length){ shell.say('', ''); showKid(); } else startCount();
    }, kind === 'show' ? 2000 : 750);
  }

  /* 2. Telja strikin */
  function startCount(){
    mode = 'count'; table.classList.remove('tappable'); top.remove();
    let r = 0;
    const pad = el('div', {class: 'choices c5'}, [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(d => el('button', {class: 'choice', type: 'button', text: String(d), onclick: e => onDigit(d, e.currentTarget)})));
    swap(bottom, pad);
    const askRow = () => {
      wrongs = 0; busy = false;
      rows.forEach((x, i) => x.row.classList.toggle('active', i === r));
      Array.from(pad.children).forEach(b => { b.disabled = false; b.classList.remove('wrong'); });
      shell.say('', '');
      shell.ask('Teldu strikin', 'Hve mörg börn eru í flokknum „' + CATS[r] + '“?');
      tick();
    };
    const fillRow = (first, kind, msg) => {
      busy = true; score.total++; if (first) score.first++;
      rows[r].num.textContent = tally[r];
      shell.say(kind, msg); step++; tick();
      later(() => {
        r++;
        if (r < 4) askRow();
        else { rows.forEach(x => x.row.classList.remove('active')); startChart(); }
      }, kind === 'show' ? 2000 : 750);
    };
    onDigit = (d, btn) => {
      if (busy) return;
      if (d === tally[r]) return fillRow(wrongs === 0, 'good', pick(PRAISE));
      wrongs++; btn.classList.add('wrong'); btn.disabled = true;
      if (wrongs >= 2) fillRow(false, 'show', 'Rétt svar er ' + tally[r] + '. Eitt strik fyrir hvert barn.');
      else shell.say('retry', 'Teldu strikin aftur. Eitt strik er eitt barn.');
    };
    askRow();
  }

  /* 3. Búa til súlurit */
  function startChart(){
    mode = 'chart'; busy = false;
    let tries = 0;
    chart = barChart(vals, () => { chart.unmark(); shell.enable(true); }, tally);
    table.remove();
    swap(bottom, el('div', {class: 'sheet'}, chart.el));
    shell.say('', '');
    shell.ask('Búðu til súlurit', 'Litaðu jafn marga reiti og strikin sýna.');
    tick();
    const done = (first, kind, msg) => {
      score.total++; if (first) score.first++;
      chart.lock(); chart.unmark(); step++; tick();
      shell.say(kind, msg);
      shell.action('Áfram', once(startPick));
    };
    shell.action('Athuga', () => {
      const bad = [0, 1, 2, 3].filter(i => vals[i] !== tally[i]);
      if (!bad.length) return done(tries === 0, 'good', pick(PRAISE));
      tries++;
      if (tries >= 2){
        for (let i = 0; i < 4; i++) vals[i] = tally[i];
        chart.paint();
        return done(false, 'show', 'Svona lítur súluritið út. Hver súla er jafn há og fjöldinn sýnir.');
      }
      chart.mark(bad, 'flag'); shell.enable(false);
      shell.say('retry', 'Ekki alveg. Skoðaðu merktu súlurnar og teldu strikin undir þeim.');
    }, false);
  }

  /* 4. Fæstir og flestir */
  function startPick(){
    mode = 'pick'; shell.action('', null);
    const qs = [
      { text: 'Í hvaða flokki eru fæstir?', ans: tally.indexOf(Math.min(...tally)), hint: 'Finndu lægstu súluna.', word: 'Fæstir' },
      { text: 'Í hvaða flokki eru flestir?', ans: tally.indexOf(Math.max(...tally)), hint: 'Finndu hæstu súluna.', word: 'Flestir' }
    ];
    let qi = 0;
    const askQ = () => {
      wrongs = 0; busy = false;
      chart.unmark(); shell.say('', '');
      shell.ask(qs[qi].text, 'Ýttu á súluna.');
      tick();
    };
    const solved = (first, kind, msg) => {
      const q = qs[qi];
      busy = true; score.total++; if (first) score.first++;
      chart.mark([q.ans], 'best');
      shell.say(kind, msg); step++; tick();
      later(() => { qi++; if (qi < qs.length) askQ(); else finish(score); }, kind === 'show' ? 2400 : 1300);
    };
    chart.pick(i => {
      if (busy) return;
      const q = qs[qi];
      if (i === q.ans) return solved(wrongs === 0, 'good', pick(PRAISE));
      wrongs++; chart.nope(i);
      if (wrongs >= 2) solved(false, 'show', q.word + ' eru í flokknum „' + CATS[q.ans] + '“.');
      else shell.say('retry', q.hint);
    });
    askQ();
  }

  showKid();
}

/* ================= leikur 2: lestu úr súluritinu ================= */
function gameChart(shell, finish){
  const data = GEN.chart(), qs = GEN.chartQuestions(data), score = newScore();
  let qi = 0, sel = -1, tapping = false;
  DBG.cur = { data, qs, get qi(){ return qi; } };
  const chart = lolliChart(data.kids, i => { if (!tapping) return; sel = i; chart.select(i); shell.enable(true); });
  swap(shell.stage, el('div', {class: 'sheet'}, chart.el));
  function ask(){
    if (qi >= qs.length) return finish(score);
    const q = qs[qi];
    let row = null;
    sel = -1; chart.clear(); shell.progress(qi, qs.length); shell.say('', '');
    const j = judge(shell, score, {
      next: () => { qi++; ask(); },
      reveal(){
        tapping = false; chart.clear(); chart.mark(q.marks, 'right');
        if (row){ lockChoices(row); showRight(row, q.options, q.answer); }
        return q.explain;
      }
    });
    if (q.kind === 'tap'){
      tapping = true;
      shell.ask(q.text, 'Ýttu á barnið í súluritinu.');
      swap(shell.answer);
      shell.action('Athuga', () => {
        if (sel < 0) return;
        if (sel === q.answer){ tapping = false; chart.clear(); chart.mark([sel], 'right'); j.right(); return; }
        chart.clear(); chart.mark([sel], 'wrong'); sel = -1; shell.enable(false);
        j.wrong(q.hint);
      }, false);
    } else {
      tapping = false;
      shell.ask(q.text, 'Veldu rétt svar.');
      shell.action('Áfram', null, false);
      row = choices(q.options, q.cols, (o, b, w) => {
        if (o.v === q.answer){ b.classList.add('right'); lockChoices(w); chart.mark(q.marks, 'right'); j.right(); }
        else { b.classList.add('wrong'); b.disabled = true; j.wrong(q.hint); }
      });
      swap(shell.answer, row);
    }
  }
  ask();
}

/* ================= leikur 3: málbandið ================= */
function gameTape(shell, finish){
  const rounds = GEN.tapeRounds(), score = newScore();
  const PX = 6, PAD = 60, MAX = 210, SW = PAD * 2 + MAX * PX;
  let i = 0, val = 100, locked = false, level = 'A', hint = false, miniMark = null;
  DBG.cur = { rounds, get i(){ return i; }, get val(){ return val; } };
  const labels = () => level === 'A' ? [[0, '0'], [50, '50 cm'], [100, '100 cm'], [150, '150 cm'], [200, '200 cm']] : [[0, '0'], [100, '1 m'], [200, '2 m']];
  const sign = el('div', {class: 'sign'});
  const mini = svg('svg', {viewBox: '0 0 340 44', class: 'mini', role: 'img', 'aria-label': 'Allt málbandið'});
  const strip = svg('svg', {viewBox: '0 0 ' + SW + ' 104', width: SW, height: 104, class: 'strip', 'aria-hidden': 'true'});
  const zoom = el('div', {class: 'zoom', id: 'zoom', tabindex: 0, role: 'slider', 'aria-label': 'Málband. Dragðu til hliðar.', 'aria-valuemin': 0, 'aria-valuemax': MAX}, strip, el('div', {class: 'needle'}));
  const tri = d => art('0 0 16 16', 16, 16, '<path d="' + (d < 0 ? 'M11 2 3 8l8 6z' : 'M5 2l8 6-8 6z') + '" fill="#18274A"/>');
  const nudges = el('div', {class: 'nudges'},
    el('button', {class: 'choice nudge', type: 'button', 'aria-label': 'Einn sentimetra til vinstri', onclick: () => stepBy(-1)}, tri(-1), '1 cm'),
    el('button', {class: 'choice nudge', type: 'button', 'aria-label': 'Einn sentimetra til hægri', onclick: () => stepBy(1)}, '1 cm', tri(1)));
  swap(shell.stage, sign, mini, zoom, nudges);
  swap(shell.answer);

  function drawStrip(){
    const X = v => PAD + v * PX, labs = labels();
    swap(strip,
      svg('rect', {x: PAD - 27, y: 18, width: 15, height: 68, rx: 2, fill: '#9AA5B8', stroke: INK, 'stroke-width': 1.6}),
      svg('rect', {x: PAD - 12, y: 24, width: MAX * PX + 36, height: 56, fill: TAPE, stroke: INK, 'stroke-width': 2}));
    for (let v = 0; v <= MAX; v++){
      const ten = v % 10 === 0;
      strip.append(svg('line', {x1: X(v), y1: 24, x2: X(v), y2: 24 + (v % 50 === 0 ? 26 : ten ? 21 : v % 5 === 0 ? 14 : 8), stroke: INK, 'stroke-width': ten ? 2 : 1.1}));
    }
    labs.forEach(l => strip.append(svg('text', {x: X(l[0]), y: 72, 'text-anchor': 'middle', class: 'tape-lab', text: l[1]})));
    if (hint) for (let v = 10; v <= MAX; v += 10){
      if (!labs.some(l => l[0] === v)) strip.append(svg('text', {x: X(v), y: 62, 'text-anchor': 'middle', class: 'tape-hint', text: String(v)}));
    }
  }
  function drawMini(){
    const X = v => 12 + v * 316 / MAX;
    swap(mini, svg('rect', {x: 8, y: 6, width: 324, height: 20, rx: 3, fill: TAPE, stroke: INK, 'stroke-width': 1.6}));
    for (let v = 0; v <= MAX; v += 10) mini.append(svg('line', {x1: X(v), y1: 6, x2: X(v), y2: 6 + (v % 50 === 0 ? 10 : 5), stroke: INK, 'stroke-width': v % 50 === 0 ? 1.6 : 1}));
    labels().forEach(l => mini.append(svg('text', {x: X(l[0]), y: 40, 'text-anchor': 'middle', class: 'mini-lab', text: l[1]})));
    miniMark = svg('g', null, svg('line', {x1: 0, y1: 1, x2: 0, y2: 30, stroke: RED, 'stroke-width': 3, 'stroke-linecap': 'round'}), svg('circle', {cx: 0, cy: 16, r: 4.5, fill: RED}));
    mini.append(miniMark);
  }
  function set(v, snap){
    val = clamp(v, 0, MAX);
    if (snap) val = Math.round(val);
    strip.style.transition = snap && !calm ? 'transform .18s ease-out' : 'none';
    strip.style.transform = 'translateX(' + (-(PAD + val * PX)) + 'px)';
    if (miniMark) miniMark.setAttribute('transform', 'translate(' + (12 + val * 316 / MAX) + ' 0)');
  }
  const touched = () => shell.enable(true);
  function stepBy(d){ if (locked) return; set(Math.round(val) + d, true); touched(); }

  let drag = null, mdown = false;
  zoom.addEventListener('pointerdown', e => {
    if (locked) return;
    drag = { x: e.clientX, v: val };
    try { zoom.setPointerCapture(e.pointerId); } catch (err) {}
    zoom.classList.add('grab');
  });
  zoom.addEventListener('pointermove', e => { if (drag && !locked) set(drag.v - (e.clientX - drag.x) / PX, false); });
  const endDrag = () => { if (!drag) return; drag = null; zoom.classList.remove('grab'); set(val, true); touched(); };
  zoom.addEventListener('pointerup', endDrag);
  zoom.addEventListener('pointercancel', endDrag);
  zoom.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft'){ e.preventDefault(); stepBy(-1); }
    if (e.key === 'ArrowRight'){ e.preventDefault(); stepBy(1); }
  });
  const miniAt = e => { const b = mini.getBoundingClientRect(); return ((e.clientX - b.left) * (340 / b.width) - 12) * MAX / 316; };
  mini.addEventListener('pointerdown', e => {
    if (locked) return;
    mdown = true;
    try { mini.setPointerCapture(e.pointerId); } catch (err) {}
    set(miniAt(e), true); touched();
  });
  mini.addEventListener('pointermove', e => { if (mdown && !locked) set(miniAt(e), true); });
  const endMini = () => { mdown = false; };
  mini.addEventListener('pointerup', endMini);
  mini.addEventListener('pointercancel', endMini);

  function round(){
    if (i >= rounds.length) return finish(score);
    const r = rounds[i];
    level = r.level; hint = false; locked = false;
    shell.progress(i, rounds.length);
    drawStrip(); drawMini(); set(val, true);
    swap(sign, el('b', {text: String(r.v)}), 'cm');
    shell.ask('Hvar er ' + r.v + ' cm á málbandinu?', level === 'B' ? 'Nú stendur 1 m og 2 m á málbandinu. Mundu: 1 m = 100 cm.' : 'Dragðu málbandið þar til rauða strikið er á réttum stað.');
    shell.say('', '');
    const j = judge(shell, score, {
      next: () => { i++; round(); },
      reveal(){ locked = true; hint = true; drawStrip(); set(r.v, true); return 'Hér er ' + r.v + ' cm.'; }
    });
    shell.action('Athuga', () => {
      const d = r.v - val;
      if (d === 0){ locked = true; hint = true; drawStrip(); set(val, true); j.right(); return; }
      shell.enable(false);
      if (Math.abs(d) === 1){ shell.say('retry', 'Alveg að koma! Rauða strikið er á ' + val + ' cm. Færðu þig um 1 cm.'); return; }
      j.wrong('Rauða strikið er á ' + val + ' cm. ' + r.v + ' cm er lengra til ' + (d > 0 ? 'hægri' : 'vinstri') + '.' + (level === 'B' ? ' Mundu: 1 m = 100 cm.' : ''));
    }, false);
  }
  round();
}

const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
/* Hlutur teiknaður frá x = 0 að x = L með miðju í y = 0. */
function drawThing(id, L){
  const g = svg('g'), base = {stroke: INK, 'stroke-width': 1.4, 'stroke-linejoin': 'round'};
  const add = (tag, a) => g.append(svg(tag, Object.assign({}, base, a)));
  if (id === 'pencil'){
    add('rect', {x: 0, y: -7, width: 9, height: 14, rx: 3, fill: '#F2A0B4'});

function gameRuler(shell, finish){
  const U = 22, Z0 = 60, rounds = GEN.ruler(), score = newScore();
  let i = 0, off = 0, canDrag = false, locked = false, drag = null;
  DBG.cur = { rounds, get i(){ return i; }, get off(){ return off; } };
  const scene = svg('svg', {viewBox: '0 0 340 106', class: 'rulerscene', role: 'img', 'aria-label': 'Hlutur og reglustika'});
  const thing = svg('g'), guides = svg('g'), ruler = svg('g');
  ruler.append(svg('rect', {x: -12, y: 42, width: 14 * U + 24, height: 56, rx: 5, fill: '#F1DDB0', stroke: INK, 'stroke-width': 1.8}));
  for (let h = 0; h <= 28; h++){
    const whole = h % 2 === 0, x = h * U / 2;
    ruler.append(svg('line', {x1: x, y1: 42, x2: x, y2: whole ? 57 : 50, stroke: INK, 'stroke-width': whole ? 1.6 : 1}));
    if (whole) ruler.append(svg('text', {x: x, y: 73, 'text-anchor': 'middle', class: 'ruler-num', text: String(h / 2)}));
  }
  const grip = svg('path', {d: 'M132 87h44M132 87l7-5M132 87l7 5M176 87l-7-5M176 87l-7 5', fill: 'none', stroke: INK, 'stroke-width': 2.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.5});
  const hit = svg('rect', {x: -12, y: 38, width: 14 * U + 24, height: 64, class: 'ruler-hit', tabindex: 0, role: 'slider', 'aria-label': 'Reglustika'});
  ruler.append(grip, hit);
  scene.append(thing, ruler, guides);
  const place = (v, snap) => {
    off = snap ? Math.round(clamp(v, -2, 4)) : clamp(v, -2.4, 4.4);
    ruler.style.transition = snap && !calm ? 'transform .15s ease-out' : 'none';
    ruler.style.transform = 'translate(' + (Z0 + off * U) + 'px,0px)';
  };
  const unit = () => 340 / scene.getBoundingClientRect().width / U;
  hit.addEventListener('pointerdown', e => {
    if (!canDrag || locked) return;
    drag = { x: e.clientX, o: off };
    try { hit.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  hit.addEventListener('pointermove', e => { if (drag) place(drag.o + (e.clientX - drag.x) * unit(), false); });
  const drop = () => { if (!drag) return; drag = null; place(off, true); };
  hit.addEventListener('pointerup', drop);
  hit.addEventListener('pointercancel', drop);
  scene.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, {passive: false});
  hit.addEventListener('keydown', e => {
    if (!canDrag || locked) return;
    if (e.key === 'ArrowLeft'){ e.preventDefault(); place(off - 1, true); }
    if (e.key === 'ArrowRight'){ e.preventDefault(); place(off + 1, true); }
  });
  function round(){
    if (i >= rounds.length) return finish(score);
    const r = rounds[i], t = r.thing, OX = Z0 + r.k * U, Lpx = r.len * U, slot = el('span', {class: 'slot on'});
    canDrag = r.k !== 0; locked = false;
    swap(thing, svg('g', {transform: 'translate(' + OX + ' 26)'}, drawThing(t.id, Lpx)));
    swap(guides);
    grip.style.display = canDrag ? '' : 'none';
    hit.style.cursor = canDrag ? 'grab' : 'default';
    scene.style.touchAction = canDrag ? 'none' : '';
    place(0, false);
    const showGuides = () => swap(guides,
      svg('line', {x1: OX, y1: 6, x2: OX, y2: 60, class: 'guide'}),
      svg('line', {x1: OX + Lpx, y1: 6, x2: OX + Lpx, y2: 60, class: 'guide'}));
    shell.progress(i, rounds.length);
    swap(shell.stage, el('div', {class: 'sheet', style: canDrag ? {'touch-action': 'none'} : null}, scene), el('div', {class: 'eq'}, slot, el('small', {text: 'cm'})));
    shell.ask('Hvað er ' + t.name + ' ' + t.adj + '?', canDrag ? 'Færðu reglustikuna svo að 0 sé við endann. Lestu svo af henni.' : 'Lestu af reglustikunni.');
    shell.say('', '');
    askNumber(shell, score, {
      answer: r.len, slot, len: 2, next: () => { i++; round(); },
      hint: v => (off !== r.k && v === r.len + r.k - off) ? 'Reglustikan byrjar ekki á 0. Færðu hana fyrst.' : 'Ekki alveg. Skoðaðu hvar ' + t.name + ' endar á reglustikunni.',
      shown: cap(t.name) + ' nær frá 0 að ' + r.len + '. Lengdin er ' + r.len + ' cm.',
      right(){ locked = true; showGuides(); },
      help(done){ if (done){ locked = true; place(r.k, true); showGuides(); } }
    });
  }
  round();
}

function gameLine(shell, finish){
  const data = GEN.line(), lo = data.lo, hi = data.hi, targets = data.targets, score = newScore();
  const PX = 12, PAD = 46, SW = PAD * 2 + (hi - lo) * PX, placed = [];
  const X = v => PAD + (v - lo) * PX, MX = v => 14 + (v - lo) * 312 / (hi - lo);
  let i = 0, val = lo + 25, locked = false, mark = null, drag = null, mdown = false;
  DBG.cur = { data, get i(){ return i; }, get val(){ return val; } };
  const cards = el('div', {class: 'cards'});
  const mini = svg('svg', {viewBox: '0 0 340 40', class: 'mini', role: 'img', 'aria-label': 'Öll talnalínan'});
  const strip = svg('svg', {viewBox: '0 0 ' + SW + ' 98', width: SW, height: 98, class: 'strip', 'aria-hidden': 'true'});
  const needle = el('div', {class: 'needle blue'});
  const zoom = el('div', {class: 'zoom line', id: 'zoom', tabindex: 0, role: 'slider', 'aria-label': 'Talnalína. Dragðu til hliðar.'}, strip, needle);
  const tri = d => art('0 0 16 16', 16, 16, '<path d="' + (d < 0 ? 'M11 2 3 8l8 6z' : 'M5 2l8 6-8 6z') + '" fill="#18274A"/>');
  const nudges = el('div', {class: 'nudges'},
    el('button', {class: 'choice nudge', type: 'button', 'aria-label': 'Einn til vinstri', onclick: () => stepBy(-1)}, tri(-1), '1'),
    el('button', {class: 'choice nudge', type: 'button', 'aria-label': 'Einn til hægri', onclick: () => stepBy(1)}, '1', tri(1)));
  swap(shell.stage, cards, mini, zoom, nudges);
  swap(shell.answer);

  function drawStrip(){
    swap(strip,
      svg('line', {x1: X(lo) - 26, y1: 50, x2: X(hi) + 20, y2: 50, stroke: RED, 'stroke-width': 3, 'stroke-linecap': 'round'}),

      if (v % 10 === 0) strip.append(svg('text', {x: X(v), y: 84, 'text-anchor': 'middle', class: 'line-lab', text: String(v)}));
    }
    placed.forEach(v => strip.append(
      svg('rect', {x: X(v) - 16, y: 13, width: 32, height: 20, rx: 5, fill: '#DFF5E8', stroke: '#1E9B5E', 'stroke-width': 1.5}),
      svg('text', {x: X(v), y: 27.5, 'text-anchor': 'middle', class: 'flag-t', text: String(v)}),
      svg('circle', {cx: X(v), cy: 50, r: 5, fill: '#1E9B5E', stroke: '#fff', 'stroke-width': 1.5})));
  }
  function drawMini(){
    swap(mini,
      svg('line', {x1: 6, y1: 14, x2: 330, y2: 14, stroke: RED, 'stroke-width': 2.4, 'stroke-linecap': 'round'}),
      svg('path', {d: 'M339 14l-9-5v10z', fill: RED}));
    for (let v = lo; v <= hi; v += 10) mini.append(
      svg('line', {x1: MX(v), y1: 8, x2: MX(v), y2: 20, stroke: INK, 'stroke-width': 1.5}),
      svg('text', {x: MX(v), y: 36, 'text-anchor': 'middle', class: 'mini-lab', text: String(v)}));
    placed.forEach(v => mini.append(svg('circle', {cx: MX(v), cy: 14, r: 4, fill: '#1E9B5E'})));
    mark = svg('line', {x1: 0, y1: 2, x2: 0, y2: 26, stroke: '#2D6FE0', 'stroke-width': 3.2, 'stroke-linecap': 'round'});
    mini.append(mark);
  }
  function set(v, snap){
    val = clamp(v, lo, hi);
    if (snap) val = Math.round(val);
    strip.style.transition = snap && !calm ? 'transform .18s ease-out' : 'none';
    strip.style.transform = 'translateX(' + (-X(val)) + 'px)';
    if (mark) mark.setAttribute('transform', 'translate(' + MX(val) + ' 0)');
  }
  const touched = () => shell.enable(true);
  function stepBy(d){ if (locked) return; set(Math.round(val) + d, true); touched(); }

  zoom.addEventListener('pointerdown', e => {
    if (locked) return;
    drag = { x: e.clientX, v: val };
    try { zoom.setPointerCapture(e.pointerId); } catch (err) {}
    zoom.classList.add('grab');
  });
  zoom.addEventListener('pointermove', e => { if (drag && !locked) set(drag.v - (e.clientX - drag.x) / PX, false); });
  const endDrag = () => { if (!drag) return; drag = null; zoom.classList.remove('grab'); set(val, true); touched(); };
  zoom.addEventListener('pointerup', endDrag);
  zoom.addEventListener('pointercancel', endDrag);
  zoom.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft'){ e.preventDefault(); stepBy(-1); }
    if (e.key === 'ArrowRight'){ e.preventDefault(); stepBy(1); }
  });
  const miniAt = e => { const b = mini.getBoundingClientRect(); return lo + ((e.clientX - b.left) * (340 / b.width) - 14) * (hi - lo) / 312; };
  mini.addEventListener('pointerdown', e => {
    if (locked) return;
    mdown = true;
    try { mini.setPointerCapture(e.pointerId); } catch (err) {}
    set(miniAt(e), true); touched();
  });
  mini.addEventListener('pointermove', e => { if (mdown && !locked) set(miniAt(e), true); });
  const endMini = () => { mdown = false; };
  mini.addEventListener('pointerup', endMini);
  mini.addEventListener('pointercancel', endMini);

  function round(){
    if (i >= targets.length) return finish(score);
    const t = targets[i];
    locked = false; needle.classList.remove('faint');
    shell.progress(i, targets.length);
    swap(cards, targets.map((v, n) => el('span', {class: 'card ' + (n < i ? 'done' : n === i ? 'now' : 'wait'), text: String(v)})));
    drawStrip(); drawMini(); set(val, true);
    shell.ask('Hvar er ' + t + ' á talnalínunni?', 'Dragðu talnalínuna þar til bláa strikið bendir á töluna.');
    shell.say('', '');
    const solved = () => {
      locked = true; placed.push(t); drawStrip(); drawMini(); set(t, true);
      needle.classList.add('faint'); cards.children[i].className = 'card done';
    };
    const j = judge(shell, score, { next: () => { i++; round(); }, reveal(){ solved(); return 'Hér er ' + t + '.'; } });
    shell.action('Athuga', () => {
      const d = t - val;
      if (d === 0){ solved(); j.right(); return; }
      shell.enable(false);
      if (Math.abs(d) === 1){ shell.say('retry', 'Alveg að koma! Bláa strikið er á ' + val + '. Færðu þig um 1.'); return; }
      j.wrong('Bláa strikið er á ' + val + '. ' + t + ' er lengra til ' + (d > 0 ? 'hægri' : 'vinstri') + '.');
    }, false);
  }
  round();
}

function metreSticks(m, c, asCm){
  const at = n => [13 + (n % 5) * 64, 8 + Math.floor(n / 5) * 30];
  let last = m;
  if (last % 5 === 4) last++;
  const s = svg('svg', {viewBox: '0 0 340 ' + ((Math.floor(last / 5) + 1) * 30 + 8), class: 'model', role: 'img', 'aria-label': m + ' m og ' + c + ' cm'});
  for (let n = 0; n < m; n++){
    const p = at(n);
    s.append(
      svg('rect', {x: p[0], y: p[1], width: 58, height: 22, rx: 3, fill: TAPE, stroke: INK, 'stroke-width': 1.5}),
      svg('text', {x: p[0] + 29, y: p[1] + 15.5, 'text-anchor': 'middle', class: 'stick-t', text: asCm ? '100 cm' : '1 m'}));
  }
  const p = at(last), w = Math.max(8, Math.round(58 * c / 100));
  s.append(
    svg('rect', {x: p[0], y: p[1], width: w, height: 22, rx: 3, fill: '#FFE9A8', stroke: INK, 'stroke-width': 1.5}),
    svg('text', {x: p[0] + w + 6, y: p[1] + 15.5, class: 'stick-t', text: c + ' cm'}));
  return s;
}

/* ================= leikur 9: frádráttur með láni ================= */
/* Einn dálkur í einu, frá hægri. Barnið ákveður sjálft hvort það þarf lán. */
function gameBorrow(shell, finish){
  const rounds = GEN.borrowRounds(), score = newScore(), WHERE = ['hundruðin', 'tugirnir', 'einingarnar'];
  let i = 0;
  DBG.cur = { rounds, get i(){ return i; }, peek: null };
  function round(){
    if (i >= rounds.length) return finish(score);
    const r = rounds[i], top = digs3(r.a), bot = digs3(r.b), cur = top.map(v => v == null ? 0 : v), ans = [null, null, null];
    const title = r.a + ' − ' + r.b, sheet = el('div', {class: 'sheet'});
    let col = 2, wrongs = 0, done = false;
    const bv = () => bot[col] == null ? 0 : bot[col];
    const need = () => cur[col] < bv();
    const draw = () => swap(sheet, subGrid(top, bot, cur, ans, done ? -1 : col, true));
    const step = () => shell.ask(title, (col === 2 ? 'Byrjaðu á einingunum: ' : 'Næst eru ' + WHERE[col] + ': ') + cur[col] + ' − ' + bv() + '.');
    const lend = () => { cur[col - 1] -= 1; cur[col] += 10; draw(); };
    const go = once(() => { i++; round(); });
    const fill = (first, kind, text) => {
      score.total++; if (first) score.first++;
      ans[col] = cur[col] - bv(); wrongs = 0; col--;
      while (col >= 0 && cur[col] === 0 && bot[col] == null) col--;
      if (col < 0){
        done = true; activeDigits = null; draw();
        shell.ask(title + ' = ' + r.diff);
        shell.say(kind, (text ? text + ' ' : 'Rétt! ') + title + ' = ' + r.diff + '.');
        shell.action('Áfram', go);
        if (kind === 'good') later(go, 1700);
        return;
      }
      draw(); shell.say(kind, text || 'Rétt.'); step();
    };
    const miss = msg => {
      wrongs++;
      if (wrongs < 2){ shell.say('retry', msg); return; }
      const lent = need();
      if (lent) lend();
      fill(false, 'show', (lent ? (col === 2 ? 'Hér þarf að fá lánaðan tug. ' : 'Hér þarf að fá lánað hundrað. ') : '') + cur[col] + ' − ' + bv() + ' = ' + (cur[col] - bv()) + '.');
    };
    const onLend = () => {
      if (done) return;
      if (!need()) return miss('Hér þarf ekki lán. ' + cur[col] + ' − ' + bv() + ' gengur upp.');
      lend();
      shell.say('show', col === 2 ? 'Einum tug er skipt í 10 einingar.' : 'Einu hundraði er skipt í 10 tugi.');
      shell.ask(title, 'Nú reiknar þú ' + cur[col] + ' − ' + bv() + '.');
    };
    const onKey = d => {
      if (done) return;
      if (need()) return miss(cur[col] + ' − ' + bv() + ' gengur ekki. Ýttu á „Fá lánað“.');
      if (d !== cur[col] - bv()) return miss('Ekki alveg. Reiknaðu ' + cur[col] + ' − ' + bv() + ' aftur.');
      fill(wrongs === 0, 'good');
    };
    swap(shell.stage, sheet);
    swap(shell.answer,
      el('button', {class: 'choice wide', id: 'lend', type: 'button', text: 'Fá lánað', onclick: onLend}),
      el('div', {class: 'choices c5', id: 'digits'}, [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(d => el('button', {class: 'choice', type: 'button', text: String(d), onclick: () => onKey(d)}))));
    shell.progress(i, rounds.length);
    shell.say('', '');
    shell.action('Áfram', null, false);
    activeDigits = onKey;
    DBG.cur.peek = () => ({ col, done, need: !done && need(), digit: done ? null : cur[col] - bv() });
    draw(); step();
  }
  round();
}

function gameMixed(shell, finish){
  const rounds = GEN.mixed(), score = newScore();
  let i = 0;

    const r = rounds[i], slot = el('span', {class: 'slot on'}), help = el('div', {class: 'lower'});

    shell.progress(i, rounds.length);

    shell.ask('Reiknaðu dæmið', 'Skoðaðu vel hvort þetta er plús eða mínus.');

    if (r.op === '+'){
      askSum(shell, score, { a: r.a, b: r.b, slot, next, mixed: true, help: done => swap(help, el('div', {class: 'sheet'}, columns(r.a, r.b, done))) });

      hint: v => v === r.a + r.b ? 'Þetta er mínusdæmi. Dragðu frá.' : lent ? 'Ekki alveg. Hér þarf að fá lánað.' : 'Ekki alveg. Skoðaðu dálkana.',

      help: done => swap(help, el('div', {class: 'sheet'}, subGrid(m.top, m.bot, m.cur, done ? m.ans : m.ans.map(x => x == null ? null : '?'), -1)))
    });
  }
  round();
}

/* ================= heim og úrslit ================= */
function starTape(n, max){
  const x0 = 14, x1 = 316, u = (x1 - x0) / max, X = v => x0 + v * u;
  const s = svg('svg', {viewBox: '0 0 330 54', class: 'startape', role: 'img', 'aria-label': n + ' ' + starWord(n) + ' af ' + max});
  s.append(svg('rect', {x: 4, y: 14, width: 322, height: 28, rx: 5, fill: '#FFF3C9', stroke: INK, 'stroke-width': 2}));
  if (n > 0) s.append(svg('path', {d: 'M9 14H' + X(n) + 'V42H9a5 5 0 0 1-5-5V19a5 5 0 0 1 5-5Z', fill: TAPE, stroke: INK, 'stroke-width': 2}));
  for (let i = 0; i <= max; i++){
    const big = i % 5 === 0;
    s.append(svg('line', {x1: X(i), y1: 14, x2: X(i), y2: 14 + (big ? 11 : 7), stroke: INK, 'stroke-width': big ? 1.8 : 1.1}));
    if (big) s.append(svg('text', {x: X(i), y: 38, 'text-anchor': 'middle', class: 'tape-num', text: String(i)}));
  }
  s.append(
    svg('line', {x1: X(n), y1: 8, x2: X(n), y2: 49, stroke: RED, 'stroke-width': 3, 'stroke-linecap': 'round'}),
    svg('path', {d: 'M' + (X(n) - 7) + ' 2H' + (X(n) + 7) + 'L' + X(n) + ' 12Z', fill: RED}));
  return s;
}
function showHome(){
  session++; activePad = null; activeDigits = null;
  const total = GAMES.reduce((sum, g) => sum + (state.stars[g.id] || 0), 0), max = GAMES.length * 3;
  const groups = Array.from(new Set(GAMES.map(g => g.group)));
  const row = g => {
    const n = state.stars[g.id] || 0;
    return el('li', null, el('button', {class: 'game', id: 'game-' + g.id, type: 'button', style: {'--hue': g.hue, '--tint': g.tint}, onclick: () => startGame(g)},
      el('span', {class: 'ico'}, art('0 0 60 60', 60, 60, g.icon)),
      el('span', {class: 'txt'}, el('span', {class: 'pg', text: g.page}), el('span', {class: 'name', text: g.title}), el('span', {class: 'blurb', text: g.blurb})),
      el('span', {class: 'stars', role: 'img', 'aria-label': n + ' ' + starWord(n) + ' af 3'}, [0, 1, 2].map(i => star(i < n, 19)))));
  };
  swap(app, el('main', {class: 'home'},
    el('header', {class: 'hero'},
      el('p', {class: 'eyebrow', text: 'Stærðfræði, bls. 4–56'}),
      el('h1', null, el('span', {text: 'Lærileikir'}), el('span', {class: 'who', text: CONFIG.owner})),
      starTape(total, max),
      el('p', {class: 'tapecap'}, el('b', {text: String(total)}), ' ' + starWord(total) + ' af ' + max)),
    groups.map(gr => el('section', {class: 'group'}, el('h2', {text: gr}), el('ul', {class: 'games'}, GAMES.filter(g => g.group === gr).map(row)))),
    el('p', {class: 'note', text: 'Ný dæmi í hvert sinn. Stjörnurnar geymast í þessu tæki.'})));
}
function startGame(g){
  const shell = openShell(g);
  g.run(shell, score => showResult(g, score));
}
function showResult(game, score){
  session++; activePad = null; activeDigits = null;
  const n = starsFor(score), prev = state.stars[game.id] || 0;
  state.stars[game.id] = Math.max(prev, n);
  state.plays[game.id] = (state.plays[game.id] || 0) + 1;
  save();
  const head = ['', 'Þú kláraðir leikinn!', 'Vel gert!', 'Frábær vinna!'][n];
  const lead = ['',
    'Þú gafst ekki upp og það skiptir mestu. Prófaðu aftur, það gengur betur í hvert sinn.',
    'Æfingin skapar meistarann. Prófaðu aftur og sjáðu hvort þú nærð þremur stjörnum.',
    'Þú vandaðir þig og það skilaði sér.'][n];
  swap(app, el('main', {class: 'result'},
    el('p', {class: 'eyebrow', text: game.title}),
    el('div', {class: 'bigstars', role: 'img', 'aria-label': n + ' ' + starWord(n) + ' af 3'}, [0, 1, 2].map(i => {
      const s = star(i < n, 76);
      if (i < n) s.style.animationDelay = (0.15 + i * 0.22) + 's';
      return s;
    })),
    el('h1', {text: head}),
    el('p', {class: 'lead', text: lead}),
    el('p', {class: 'line', text: 'Rétt í fyrstu tilraun: ' + score.first + ' af ' + score.total + '.'}),
    (n > prev && prev > 0) ? el('p', {class: 'best', text: 'Nýtt met í þessum leik!'}) : null,
    el('div', {class: 'result-actions'},
      el('button', {class: 'primary', id: 'again', type: 'button', text: 'Spila aftur', onclick: () => startGame(game)}),
      el('button', {class: 'secondary', id: 'home', type: 'button', text: 'Heim', onclick: showHome}))));
  if (!calm) confetti(n);
}
function confetti(n){
  const c = el('canvas', {class: 'confetti', 'aria-hidden': 'true'});
  document.body.append(c);
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = c.width = Math.round(window.innerWidth * dpr), H = c.height = Math.round(window.innerHeight * dpr);
  const ctx = c.getContext('2d'), cols = [TAPE, RED, '#2D6FE0', '#1E9B5E', '#E0577A', '#7A5AE0'], s = session;
  const ps = Array.from({length: 30 + n * 30}, () => ({ x: W / 2 + (Math.random() - 0.5) * W * 0.5, y: H * 0.28, vx: (Math.random() - 0.5) * 11 * dpr, vy: (-Math.random() * 9 - 4) * dpr, z: (5 + Math.random() * 6) * dpr, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: pick(cols) }));
  let t0 = null;
  const frame = t => {
    if (s !== session){ c.remove(); return; }
    if (t0 == null) t0 = t;
    const dt = t - t0;
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => {
      p.vy += 0.32 * dpr; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - dt / 2200); ctx.fillStyle = p.c;
      ctx.fillRect(-p.z / 2, -p.z / 3, p.z, p.z * 0.66);
      ctx.restore();
    });
    if (dt < 2200) requestAnimationFrame(frame); else c.remove();
  };
  requestAnimationFrame(frame);
}

function start(data){ load(data); showHome(); }
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ stars: state.stars, plays: state.plays }));
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
